<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>268967 · Autorisation d’atelier</title>
<style>
:root{font-family:system-ui,sans-serif;color:#142a35;background:#f2f5f6;line-height:1.45;--line:#d7e1e4;--accent:#006985}
*{box-sizing:border-box}
body{margin:0}
main{width:min(1250px,100%);margin:auto;padding:20px clamp(12px,3vw,34px) 38px}
button,select{font:inherit;color:inherit;cursor:pointer}
button,select{border:1px solid #9aabb1;background:#fff;border-radius:7px;padding:7px 12px}
button:focus-visible,select:focus-visible,summary:focus-visible,td button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toolbar,.legend,.quick{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px}
.toolbar{margin-bottom:14px}
.toolbar strong{font-size:1rem}
.muted{color:#4b616a;font-size:.88rem}
.range{font-size:.83rem;border-left:1px solid #a9b9c0;padding-left:13px}
.layout{display:grid;grid-template-columns:minmax(0,2.25fr) minmax(270px,1fr);gap:14px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.modes{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.modes button[aria-pressed=true],.quick button[aria-pressed=true]{background:#e1f0f4;border-color:var(--accent);color:#00516a;font-weight:650}
.legend{font-size:.85rem;margin:14px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{height:3px;width:18px;background:var(--series);display:block}
.chart-frame{position:relative;height:clamp(300px,36vw,390px);margin-top:4px}
#atelier-chart,#atelier-points{width:100%;height:100%;position:absolute;inset:0}
#atelier-points{pointer-events:none}
#atelier-points button{position:absolute;pointer-events:auto;background:transparent;border:0;padding:0;border-radius:3px}
#atelier-points button:hover{background:#16819e13;outline:1px solid #84b7c5}
#atelier-points button:focus-visible{outline-offset:-2px}
.chart-note{margin:4px 0 12px;min-height:2.5em}
.quick button{font-size:.84rem;padding:4px 9px}
.quick{border-top:1px solid var(--line);padding-top:12px}
#atelier-detail h1{font-size:1.12rem;margin:0 0 12px}
#atelier-detail h2{font-size:.94rem;margin:16px 0 6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 0;border-bottom:1px solid #e5edef;vertical-align:top}
th{font-size:.82rem;font-weight:600}
td{font-size:.86rem}
.value{text-align:right;white-space:nowrap}
.detail-meta{margin:8px 0 0}
.flows{display:grid;gap:7px;margin:0;padding:0;list-style:none;font-size:.88rem}
.flows li{border-left:3px solid var(--series);padding:2px 0 2px 8px}
.trace{margin-top:14px}
summary{cursor:pointer;font-weight:650}
.trace-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
.trace-grid h2{font-size:.97rem;margin:0 0 4px}
.timeline{list-style:none;margin:0;padding:0;font-size:.88rem}
.timeline li{display:grid;grid-template-columns:57px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid #e5edef;align-items:baseline}
.timeline li button{border:0;padding:0;background:none;text-decoration:underline;text-decoration-color:#88aabc}
.timeline small{color:#4b616a}
@media(max-width:785px){.layout{grid-template-columns:1fr}.trace-grid{grid-template-columns:1fr}}
@media(max-width:470px){.panel{padding:11px}.modes button{font-size:.82rem;padding:6px 9px}.chart-frame{height:295px}.timeline li{grid-template-columns:52px 1fr auto;gap:4px}}
</style>
</head>
<body>
<main>
  <div class="toolbar"><strong>PF 268967</strong><span class="range muted">6 janv. – 30 avr. 2025</span>
    <label for="atelier-week" class="muted">Semaine</label><select id="atelier-week"></select>
  </div>
  <div class="layout">
    <section class="panel">
      <div class="modes" aria-label="Indicateur">
        <button type="button" data-mode="packaging" aria-pressed="true">Prélèvements d’étuis</button>

        <button type="button" data-mode="available" aria-pressed="false">Stock utilisable à D1920</button>
      </div>
      <div class="legend" id="atelier-legend"></div>
      <div class="chart-frame"><canvas id="atelier-chart" role="img" aria-label="Courbe des volumes par semaine"></canvas><div id="atelier-points"></div></div>
      <p class="chart-note muted" id="atelier-chart-note"></p>
      <div class="quick" aria-label="Semaines à examiner">
        <button type="button" data-week="2025-04-07" data-quick-mode="packaging">7 avr. · Retraits observés à zéro</button>
        <button type="button" data-week="2025-04-14" data-quick-mode="physical">14 avr. · Creux de stock</button>
        <button type="button" data-week="2025-04-21" data-quick-mode="packaging">21 avr. · Reprise des retraits</button>
      </div>
    </section>
    <section class="panel" id="atelier-detail" aria-live="polite"></section>
  </div>
  <details class="panel trace" id="atelier-trace"><summary>Parcours du deuxième lot</summary><div class="trace-grid" id="atelier-timeline"></div></details>
</main>

d":[null,38412,38412],"served":[null,38412,38412],"cells":{"packaging":["Feuille1!J858"],"physical":["Stocks!E102"]}},{"date":"2025-04-21","end":"2025-04-27","packaging":[94000,0,0],"physical":[742819,809472,809472],"available":[null,701672,701672],"held":[null,107800,107800],"demand":[null,1259,1259],"served":[null,1259,1259],"cells":{"packaging":["Feuille1!J859"],"physical":["Stocks!E22"]}},{"date":"2025-04-28","end":"2025-04-30","packaging":[null,0,0],"physical":[781817,808213,808213],"available":[null,700413,700413],"held":[null,107800,107800],"demand":[null,0,0],"served":[null,0,0],"cells":{"packaging":[],"physical":["Stocks!E104"]}}],"colors":["#324454","#ad5013","#006985"],"common_end":"2025-04-30","closure":{"physical":[808213,808213],"available":[808213,700413],"held":[0,107800]},"cases":[{"label":"Lancement 7 avril","events":[{"date":"2025-02-11","label":"Achat du 344135","qty":120000,"lot":"STOCKLOT-00000230"},{"date":"2025-03-18","label":"Réception du composant","qty":120000,"lot":"STOCKLOT-00000230"},{"date":"2025-03-24","label":"Composant libéré","qty":120000,"lot":"STOCKLOT-00000230"},{"date":"2025-04-07","label":"Fabrication du deuxième lot","qty":107800,"lot":"LOT-00000272","shipment":""},{"date":"2025-04-07","label":"Départ de l’usine","qty":107800,"lot":"LOT-00000272","shipment":"SHIP-00000057"},{"date":"2025-04-09","label":"Entrée physique à D1920","qty":107800,"lot":"LOT-00000278","shipment":"SHIP-00000057"},{"date":"2025-04-30","label":"Libération à D1920","qty":107800,"lot":"LOT-00000278","shipment":""}],"served":508921,"weekly_mae":28955,"stock_mae":36777,"order_id":"FROZEN|M-1430|item:268967|2"},{"label":"Lancement 14 avril","events":[{"date":"2025-02-11","label":"Achat du 344135","qty":120000,"lot":"STOCKLOT-00000230"},{"date":"2025-03-18","label":"Réception du composant","qty":120000,"lot":"STOCKLOT-00000230"},{"date":"2025-03-24","label":"Composant libéré","qty":120000,"lot":"STOCKLOT-00000230"},{"date":"2025-04-14","label":"Fabrication d <script>
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('atelier-data').textContent);
  const weeks = data.weeks;
  const chart = document.getElementById('atelier-chart');
  const points = document.getElementById('atelier-points');
  const detail = document.getElementById('atelier-detail');
  const select = document.getElementById('atelier-week');
  const modes = document.querySelectorAll('[data-mode]');
  const labels = ['Observé', ...data.cases.map(scenario => `Simulé · ${scenario.label.replace('Lancement ', '')}`)];
  const integers = new Intl.NumberFormat('fr-FR');
  const dates = new Intl.DateTimeFormat('fr-FR', {day:'numeric', month:'short', timeZone:'UTC'});
  const dateLabel = value => dates.format(new Date(`${value}T00:00:00Z`));
  const qty = value => value === null ? '—' : integers.format(value);
  const content = {
    packaging: ['Étuis prélevés', 'Volumes hebdomadaires dans l’atelier 1430. Les trous signalent des semaines sans observation.'],
    physical: ['Stock physique', 'Stocks à l’ouverture de chaque semaine. Les stocks en contrôle sont compris.'],
    available: ['Stock utilisable', 'Stocks utilisables simulés à l’ouverture de chaque semaine. Les inventaires observés donnent le stock physique.']
  };
  let mode = 'packaging';
  let selected = weeks.findIndex(week => week.date === '2025-04-14');

  function element(tag, text, parent) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    parent?.append(node);
    return node;
  }

  function setWeek(index, focusPoint = false) {
    selected = index;
    select.value = weeks[index].date;
    render();
    if (focusPoint) points.querySelector(`[data-week="${weeks[index].date}"]`)?.focus();
  }

  function setMode(value) {
    mode = value;
    for (const button of modes) button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
    render();
  }

  function draw() {
    const width = chart.clientWidth;
    const height = chart.clientHeight;
    if (!width || !height) return;
    const scale = window.devicePixelRatio || 1;
    chart.width = Math.round(width * scale);
    chart.height = Math.round(height * scale);
    const g = chart.getContext('2d');
    g.scale(scale, scale);
    g.font = '12px system-ui';
    const left = width < 485 ? 54 : 67;
    const right = width - 16;
    const top = 15;
    const bottom = height - 38;
    const values = weeks.flatMap(week => week[mode]).filter(value => value !== null);
    const lo = mode === 'packaging' ? 0 : Math.floor(Math.min(...values)/100000)*100000;
    const step = mode === 'packaging' ? 25000 : 100000;
    const hi = Math.max(lo + step, Math.ceil(Math.max(...values)/step)*step);
    const x = index => left + index * (right - left) / (weeks.length - 1);
    const y = value => bottom - (bottom-top) * (value-lo) / (hi-lo);
    const slot = (right-left)/(weeks.length-1);
    g.fillStyle = '#e7f2f6';
    g.fillRect(x(selected)-slot*.48, top, slot*.96, bottom-top);
    g.lineWidth = 1;
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    for (let value=lo; value<=hi; value+=step) {
      g.strokeStyle = '#dbe6e9';
      g.beginPath(); g.moveTo(left,y(value)); g.lineTo(right,y(value)); g.stroke();
      g.fillStyle = '#435965';
      g.fillText(qty(value),left-7,y(value));
    }
    g.textAlign = 'center';
    g.textBaseline = 'top';
    const stride = width < 490 ? 4 : 3;
    for (let index=0; index<weeks.length; index+=stride) g.fillText(dateLabel(weeks[index].date),x(index),bottom+12);
    const indices = mode === 'available' ? [1, 2] : [0, 1, 2];
    for (const series of indices) {
      g.strokeStyle = data.colors[series];
      g.fillStyle = data.colors[series];
      g.lineWidth = series === 2 ? 2.7 : 2;
      g.setLineDash(series === 1 ? [5,4] : []);
      g.beginPath();
      let connected = false;
      weeks.forEach((week,index) => {
        const value=week[mode][series];
        if (value === null) { connected=false; return; }
        if (connected) g.lineTo(x(index),y(value));
        else g.moveTo(x(index),y(value));
        connected=true;
      });
      g.stroke();
      g.setLineDash([]);
      weeks.forEach((week,index) => {
        const value = week[mode][series];
        if (value === null) return;
        g.beginPath(); g.arc(x(index),y(value),index===selected ? 5 : 3,0,Math.PI*2); g.fill();
        if (index===selected) { g.save(); g.strokeStyle='#fff'; g.stroke(); g.restore(); }
      });
    }
    points.replaceChildren();
    weeks.forEach((week,index) => {
      const hit = element('button',undefined,points);
      hit.type='button';
      hit.dataset.week=week.date;
      hit.style.left=`${x(index)-slot/2}px`;
      hit.style.top=`${top}px`;
      hit.style.width=`${slot}px`;
      hit.style.height=`${bottom-top}px`;
      hit.setAttribute('aria-label',`Semaine du ${dateLabel(week.date)}. ${content[mode][0]} · ${week[mode].map(qty).join(', ')}`);
      hit.setAttribute('aria-pressed',String(index===selected));
      hit.tabIndex = index === selected ? 0 : -1;
      hit.addEventListener('click',() => setWeek(index,true));
      hit.addEventListener('keydown',event => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        setWeek(Math.min(weeks.length-1,Math.max(0,index + (event.key==='ArrowLeft' ? -1 : 1))),true);
      });
    });
  }

  function renderDetail() {
    const week = weeks[selected];
    detail.replaceChildren();
    element('h1',`${dateLabel(week.date)} – ${dateLabel(week.end)}`,detail);
    const table = element('table',undefined,detail);
    const header = element('tr',undefined,element('thead',undefined,table));
    for (const text of [content[mode][0], 'Observé', '7 avr.', '14 avr.']) element('th',text,header).scope='col';
    const body = element('tbody',undefined,table);
    for (const [label, result] of [[content[mode][0],week[mode]], ['Demande simulée',week.demand],['Livré en simulation',week.served]]) {
      const row = element('tr',undefined,body);
      element('th',label,row).scope='row';
      for (const number of result) element('td',qty(number),row).className='value';
    }
    if (mode === 'physical' || mode === 'available') {
      const row=element('tr',undefined,body);
      element('th','En contrôle',row).scope='row';
      for (const number of week.held) element('td',qty(number),row).className='value';
    }
    const sources = week.cells[mode];
    if (sources?.length) element('p',`${mode==='packaging' ? 'Mouvements d’inventaire' : 'Relevé de stock'} · ${sources.join(', ')}`,detail).className='detail-meta muted';
    if (week.end === data.common_end && mode !== 'packaging') {
      element('h2',`Clôture simulée du ${dateLabel(data.common_end)}`,detail);
      const endTable=element('table',undefined,detail);
      const endHeader=element('tr',undefined,element('thead',undefined,endTable));
      for (const text of ['Stock à D1920','7 avr.','14 avr.']) element('th',text,endHeader).scope='col';
      const endBody=element('tbody',undefined,endTable);
      for (const [key,label] of [['physical','Physique'],['available','Utilisable'],['held','En contrôle']]) {
        const row=element('tr',undefined,endBody);
        element('th',label,row).scope='row';
        for (const number of data.closure[key]) element('td',qty(number),row).className='value';
      }
    }
    const events = data.cases.flatMap((scenario,index) => scenario.events
      .filter(event=>event.date>=week.date&&event.date<=week.end).map(event=>({...event,index})));
    if (events.length) {
      element('h2','Jalons simulés du deuxième lot',detail);
      const list=element('ul',undefined,detail); list.className='flows';
      for (const event of events) {
        const row=element('li',`${dateLabel(event.date)} · ${event.label} · ${qty(event.qty)}`,list);
        row.style.setProperty('--series',data.colors[event.index+1]);
        element('div',data.cases[event.index].label,row).className='muted';
      }
    }
  }

  function render() {
    const legend = document.getElementById('atelier-legend');
    legend.replaceChildren();
    labels.forEach((label,index) => {
      if (mode==='available' && index===0) return;
      const entry=element('span',undefined,legend);
      element('i',undefined,entry).style.setProperty('--series',data.colors[index]);
      element('span',label,entry);
    });
    document.getElementById('atelier-chart-note').textContent=content[mode][1];
    chart.setAttribute('aria-label',`${content[mode][0]} par semaine, en unités`);
    for (const button of document.querySelectorAll('[data-quick-mode]')) {
      button.setAttribute('aria-pressed',String(button.dataset.week===weeks[selected].date && button.dataset.quickMode===mode));
    }
    draw();
    renderDetail();
  }

  for (const week of weeks) element('option',dateLabel(week.date),select).value=week.date;
  select.addEventListener('change',()=>setWeek(weeks.findIndex(week=>week.date===select.value)));
  for (const button of modes) button.addEventListener('click',()=>setMode(button.dataset.mode));
  for (const button of document.querySelectorAll('[data-quick-mode]')) button.addEventListener('click',()=>{
    mode=button.dataset.quickMode;
    selected=weeks.findIndex(week=>week.date===button.dataset.week);
    select.value=weeks[selected].date;
    setMode(mode);
  });
  const timeline=document.getElementById('atelier-timeline');
  for (const scenario of data.cases) {
    const section=element('section',undefined,timeline);
    element('h2',scenario.label,section);
    element('div',scenario.order_id,section).className='muted';
    const events=element('ul',undefined,section); events.className='timeline';
    for (const event of scenario.events) {
      const line=element('li',undefined,events);
      const index=weeks.findIndex(week=>event.date>=week.date && event.date<=week.end);
      if (index>=0) {
        const button=element('button',dateLabel(event.date),line);
        button.type='button'; button.addEventListener('click',()=>setWeek(index,true));
      } else element('span',dateLabel(event.date),line);
      const desc=element('span',event.label,line);
      if (event.date>data.common_end) element('small',' · prolongement simulé',desc);
      element('small',qty(event.qty),line).title=[event.lot,event.shipment].filter(Boolean).join(' · ');
    }
  }
  setWeek(selected);
  window.addEventListener('resize',draw);
})();
</script>
</body>
