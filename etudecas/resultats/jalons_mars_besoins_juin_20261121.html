<script>
(() => {
  'use strict';
  const id=name=>document.getElementById(name);
  const data=JSON.parse(id('timeline-data').textContent);
  const mode=id('view'), item=id('item'), pick=id('case'), detail=id('detail');
  const quantities=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:3});
  const dates=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
  const q=value=>Number.isFinite(value)?quantities.format(value):'Inconnu';
  const d=value=>value?dates.format(Date.parse(value+'T00:00:00Z')):'—';
  const clocks={effective_days:'Demande répartie sur les jours de la semaine',next_monday:'Demande imputée au lundi suivant'};
  function add(host,tag,value,cls){
    const el=document.createElement(tag);
    if(value!==undefined) el.textContent=value;
    if(cls) el.className=cls;
    host.append(el);
    return el;
  }
  function table(host,labels,rows,numbers=[],color){
    const grid=add(add(host,'div',undefined,'table-wrap'),'table');
    const head=add(add(grid,'thead'),'tr'), body=add(grid,'tbody');
    labels.forEach((label,i)=>{add(head,'th',label,numbers.includes(i)?'num':'').scope='col';});
    for(const values of rows){
      const row=add(body,'tr',undefined,color?.(values)?'deficit':'');
      values.forEach((value,i)=>{
        const numeric=numbers.includes(i);
        const cell=add(row,i?'td':'th',numeric?q(value):value,numeric?'num':'');
        if(!i) cell.scope='row';
      });
    }
  }
  function fold(host,label,open=false) {
    const el=add(host,'details');
    el.open=open;
    add(el,'summary',label);
    return el;
  }
  function simulation(){
    add(detail,'h2',`${item.value} · déroulé simulé à D1920`);
    add(detail,'p','Stocks à la clôture du jour. Recevoir, rendre utilisable, expédier et livrer au client sont quatre jalons distincts dans le calcul. Quantités en unités (UN).','muted');
    const week=data.march_week[item.value], simulated=week.simulated;
    add(detail,'p',`Du 3 au 9 mars, ${q(simulated.receipts)} UN arrivent en simulation
      et ${q(simulated.released)} deviennent utilisables. Le stock physique simulé passe de
      ${q(simulated.open_physical)} à ${q(simulated.close_physical)} UN. Les photos industrielles
      passent de ${q(week.observed.stock_open_physical)} à ${q(week.observed.stock_close_physical)} UN.`);
    const archive=fold(detail,'Stock et mouvements du témoin simulé par jour',true);
    const keys=['D1920_physical','D1920_available','D1920_held','physical_receipt','usable_release','D1920_shipped','customer_orders_in_run','customer_service_in_run','customer_end_backlog'];
    table(archive,['Date','Physique','Utilisable','En contrôle','Reçu','Devenu utilisable','Expédié','Demandé','Livré simulé','Reste à livrer'],
      data.physical.closing_balance_daily[item.value].map(row=>[d(row.date),...keys.map(key=>row[key])]),[1,2,3,4,5,6,7,8,9]);
    if(item.value!=='268091') return;
    const trace=fold(detail,'Positions 72, 78, 80 et 82 · transport et contrôle à D1920');
    table(trace,['Ligne d’ordre initial','Expédition simulée','Départ','Réception','Disponible','Quantité (UN)'],
      Object.entries(data.physical.by_source_row).flatMap(([line,events])=>events.map(e=>[line,e.shipment,d(e.departure),d(e.arrived),d(e.usable),e.quantity])),[5]);
    add(trace,'p','Ordres initiaux · Extract_En_cours.xlsx. Les expéditions et jalons affichés proviennent du témoin simulé.','source');
    const clock=data.timing.clocks.find(entry=>entry.clock===pick.value);
    add(detail,'h3','Retarder la mise à disposition de 14 jours');
    add(detail,'p',`32 cas calculés. Le tableau affiche les ${q(clock.groups.length)} combinaisons selon la datation sélectionnée. Le calcul local débite la demande hebdomadaire observée selon cette convention et conserve les quantités des lots.`,'muted');
    const all=clock.groups.find(row=>row.rows.length===4);
    add(detail,'p',`Quatre positions retardées · pic de manque de ${q(all.maximum_shortage)} UN${all.first_shortage?` à partir du ${d(all.first_shortage)}`:''}.`);
    table(detail,['Positions retardées','Premier manque','Pic de manque (UN)','Jours en manque','Manque cumulé (UN × jours)'],
      clock.groups.map(r=>[r.rows.join(', ')||'Aucune',d(r.first_shortage),r.maximum_shortage,r.shortage_days,r.shortage_unit_days]),[2,3,4],row=>row[2]>0);
    const daily=fold(detail,'Solde journalier du calcul local · témoin et quatre positions retardées');
    table(daily,['Date','Demande imputée (UN)','Libéré témoin (UN)','Solde témoin (UN)','Libéré retardé (UN)','Solde retardé (UN)'],
      data.timing.day_series[clock.clock].map(r=>[d(r.day),r.observed_weekly_demand_reconstructed,r.baseline_released,r.baseline_balance,r.delayed_released,r.delayed_balance]),
      [1,2,3,4,5],row=>row[5]<0);
  }
  function observation(){
    const row=data.observed[item.value].weeks[pick.value];
    add(detail,'h2',`${item.value} · semaine du ${d(pick.value)} à D1920`);
    add(detail,'p','La demande est observée à la semaine. Les départs clients bruts et les dates de libération restent inconnus. Le stock porté en semaine courante du MRP donne une borne conditionnelle.','muted');
    table(detail,['Mesure','UN','Source'],[
      ['Stock physique à l’ouverture',row.stock_open_physical,row.sources.opening],['Stock physique à la clôture',row.stock_close_physical,row.sources.closing],
      ['Mouvement net signé',row.net_movement,row.sources.movement],['Autres ajustements signés',row.other_signed_adjustment,row.sources.movement],
      ['Écart résiduel du bilan physique',row.balance_residual,'Calcul à partir des deux photos et des mouvements signés'],
      ['Demande observée',row.historical_weekly_demand,row.sources.demand],['Stock porté en semaine courante du plan',row.book_stock_current,row.sources.first_mrp],
      ['Entrées prévues dans le plan',row.book_first_week_scheduled_receipts,row.sources.first_mrp],['Besoins de sortie inscrits au plan',row.book_first_week_outflow_need,row.sources.first_mrp],
      ['Stock de clôture prévu',row.book_first_week_projected_end,row.sources.first_mrp]
    ],[1]);
    if(row.book_stock_future.length){
      add(detail,'h3','Stock porté dans les semaines futures du plan');
      table(detail,['Date du plan','UN','Source'],row.book_stock_future.map(r=>[d(r.target),r.quantity,r.source]),[1]);
    }
  }
  function revision(){
    const row=data.mrp.find(r=>r.item===item.value&&r.new_version===pick.value);
    add(detail,'h2',`${item.value} · D1920 · semaine du ${d(row.first.monday)}`);
    add(detail,'p',`Versions MRP du ${d(row.prior_version)} et du ${d(row.new_version)}. Les entrées, besoins et stocks de clôture de ce tableau sont planifiés.`,'muted');
    const old=row.first.old, latest=row.first.new;
    const oldStart=old.closing-old.incoming+old.need, newStart=latest.closing-latest.incoming+latest.need;
    table(detail,['Première semaine (UN)','Version précédente','Nouvelle version','Écart'],[
      ['Besoin au plan',old.need,latest.need,latest.need-old.need],
      ['Entrées prévues',old.incoming,latest.incoming,latest.incoming-old.incoming],
      ['Stock de départ du calcul',oldStart,newStart,newStart-oldStart],
      ['Stock de clôture projeté',old.closing,latest.closing,latest.closing-old.closing]
    ],[1,2,3]);
    add(detail,'p','Le stock de départ inclut le solde repris des semaines antérieures, lorsqu’elles appartiennent à la version.','muted');
    add(detail,'p',`Flow_Data_MRP_results.xlsx · ${old.cell} · ${latest.cell}`,'source');
    if(row.commercial?.old&&row.commercial?.new){
      add(detail,'p',`Prévision commerciale source · ${q(row.commercial.old.quantity)} → ${q(row.commercial.new.quantity)} UN. Flow_Data_Customer_Demand.xlsx · ${row.commercial.old.cell} · ${row.commercial.new.cell}.`,'source');
    }
    add(detail,'h3','Écart cumulé sur les mêmes semaines');
    table(detail,['Fenêtre','Semaines','Besoins avant (UN)','Besoins après (UN)','Écart de besoins (UN)','Écart d’entrées (UN)'],
      Object.entries(row.windows).map(([key,w])=>[({first_week:'Première semaine',four_weeks:'Quatre semaines',all_2025_common:'Semaines communes 2025'})[key],w.weeks,w.old_need,w.new_need,w.need_delta,w.incoming_delta]),[1,2,3,4,5]);
    const weeks=fold(detail,'Besoins et entrées par date · dix semaines communes');
    table(weeks,['Semaine','Besoin avant (UN)','Besoin après (UN)','Entrées avant (UN)','Entrées après (UN)','Cellules'],
      row.first_ten_common_weeks.map(w=>[d(w.monday),w.old.need,w.new.need,w.old.incoming,w.new.incoming,`${w.old.cell} · ${w.new.cell}`]),[1,2,3,4]);
    add(detail,'p','Les versions documentent des écarts de planification. La règle industrielle qui forme ces besoins reste à établir.','muted');
  }
  const renderers={sim:simulation,observed:observation,mrp:revision};
  function render(){detail.replaceChildren();renderers[mode.value]();}
  function reset(){
    const previous=pick.value;
    pick.replaceChildren();
    const lists={sim:Object.entries(clocks),
      observed:Object.keys(data.observed[item.value].weeks).map(week=>[week,`Semaine du ${d(week)}`]),
      mrp:data.mrp.filter(r=>r.item===item.value).map(r=>[r.new_version,`${r.new_version.slice(5,7)==='06'?'Juin':'Contrôle septembre'} · version du ${d(r.new_version)}`])};
    const cases=lists[mode.value];
    for(const [value,label] of cases) add(pick,'option',label).value=value;
    if(cases.some(([value])=>value===previous)) pick.value=previous;
    else if(mode.value==='observed') pick.value='2025-03-03';
    pick.disabled=mode.value==='sim'&&item.value==='268967';
    render();
  }
  mode.addEventListener('change',reset);
  item.addEventListener('change',reset);
  pick.addEventListener('change',render);
  reset();
})();
</script>
