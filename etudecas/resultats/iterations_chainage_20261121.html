<script>
(() => {

  let variant='witness';
  function add(host,tag,text,cls){

    if(cls) el.className=cls;

    return el;
  }
  function table(host,headings,rows,numbers=[]){
    const grid=add(add(host,'div',undefined,'table-wrap'),'table');
    const head=add(add(grid,'thead'),'tr'), body=add(grid,'tbody');
    headings.forEach((title,i)=>{add(head,'th',title,numbers.includes(i)?'num':'').scope='col';});
    for(const values of rows){
      const row=add(body,'tr');
      values.forEach((v,i)=>{
        const numeric=numbers.includes(i);
        const cell=add(row,i?'td':'th',numeric?q(v):v instanceof Node?undefined:v,numeric?'num':'');
        if(v instanceof Node) cell.append(v);
        if(!i) cell.scope='row';
      });
    }
  }
  function fold(parent,label,open=false){const out=add(parent,'details');out.open=open;add(out,'summary',label);return out;}
  function timing(){
    const modes=data.timing[item.value], witness=modes.witness;
    add(detail,'h2',`${item.value} · stocks à Muret sur ${data.days} jours`);
    add(detail,'p','Chaque variante rejoue les mêmes volumes d’arrivée avec un calendrier différent. L’erreur absolue moyenne est calculée sur les relevés de stock physique du lundi, rapprochés de la clôture simulée du dimanche ou du lundi. Les changements testés ne recalculent ni la fabrication ni le MRP.','muted');

    output.id='variant-detail';
    const buttons={};
    function select(name){
      variant=name;
      for(const [id,button] of Object.entries(buttons)) button.setAttribute('aria-pressed',String(id===name));

      const current=modes[name];
      add(output,'h3',labels[name]);
      const periods=[['','Toute la période'],['before_april_','Janvier à mars'],['april_may_','Avril et mai']];
      table(output,['Période','Témoin · dimanche (UN)','Variante · dimanche (UN)','Témoin · lundi (UN)','Variante · lundi (UN)'],
        periods.map(([p,label])=>[label,witness.mean_errors[p+'sunday'],current.mean_errors[p+'sunday'],witness.mean_errors[p+'monday'],current.mean_errors[p+'monday']]),[1,2,3,4]);

        current.around_march.map(row=>[day(row.d),...columns.map(c=>row[c])]),[1,2,3,4,5,6,7,8,9]);

    select(variant);
  }
  function service(){

        Object.entries(r.parent_lots).map(([id,n])=>`${id} · ${q(n)} UN`).join(' · ')]),[3]);
  }

    const groups=[['all','Tous les relevés'],['episode','3 et 10 mars'],['validation','17 mars au 7 avril']];

    const metrics=[['published','Demande publiée (UN)'],['muret_received','Entrées à Muret (UN)'],['muret_sent','Départs clients de Muret (UN)'],
      ['served','Livré au client (UN)'],['waiting_before_dispatch','Avant expédition · hors transit (UN × jours)'],
      ['customer_in_transit','En transit vers le client (UN × jours)'],['completed','Production publiée au site, ordres initiaux inclus (UN)'],
      ['new_production','Sorties de nouvelles fabrications (UN)'],['opening_order_output','Sorties issues des ordres initiaux (UN)']];
    table(detail,['Indicateur','Témoin','Essai'],metrics.map(([field,label])=>[label,witness.totals[field],dated.totals[field]]),[1,2]);
    add(detail,'h3','Stocks journaliers cumulés du 17 mars à la fin');
    const stocks=[['plant_physical','Stock physique en usine'],['plant_wip','Fabrication en cours'],['muret_physical','Stock physique à Muret'],['inbound_in_transit','En transit vers Muret']];
    table(detail,['Position du stock (UN × jours)','Témoin','Essai'],
      stocks.map(([field,label])=>[label,witness.holdout_stock_days[field],dated.holdout_stock_days[field]]),[1,2]);
    const compare=fold(detail,'Stocks et service jour par jour · témoin et essai');
    const controls=add(compare,'div',undefined,'filters');
    const label=add(controls,'label','Date');
    const picker=add(label,'select');
    picker.id='native-date';
    for(const row of witness.daily) add(picker,'option',day(row.d)).value=row.d;
    picker.value='68';
    const shown=add(compare,'div');
    function selectDay(){
      shown.replaceChildren();
      const position=Number(picker.value), base=witness.daily[position], test=dated.daily[position];
      const fields=[['plant_physical','Physique à l’usine'],['plant_wip','En cours à l’usine'],['inbound_in_transit','En transit vers Muret'],
        ['muret_physical','Physique à Muret'],['muret_usable','Utilisable à Muret'],['muret_held','En contrôle à Muret'],
        ['muret_received','Entrées à Muret'],['muret_sent','Départs de Muret'],['waiting_before_dispatch','Encore à expédier'],
        ['customer_in_transit','En transit vers le client'],['served','Livré au client']];
      table(shown,['Mesure (UN)','Témoin','Essai'],fields.map(([field,name])=>[name,base[field],test[field]]),[1,2]);
    }
    picker.addEventListener('change',selectDay);selectDay();
    const lots=fold(detail,'Expéditions et lots simulés des deux plans');
    const sites={'M-1810':'Avène','M-1430':'Gien','DC-1920':'Muret'};
    const records=data.native.lots[item.value];
    for(const [key,name] of [['witness','Témoin'],['dated_dispatch','Essai']]){
      add(lots,'h3',name);
      table(lots,['Origine','Expédition','Lot','Départ','Arrivée prévue au départ','UN'],
        records[key].map(r=>[sites[r.site],r.shipment,r.lot,day(r.departure),day(r.arrival),r.quantity]),[5]);
    }
    add(lots,'p','Les identifiants internes et les dates prévues sont ceux du registre des simulateurs.','muted');
  }
  const renderers={timing,service,native};
  function render(){detail.replaceChildren();renderers[view.value]();}
  if(data.native) add(view,'option','Expédition datée · essai apparié').value='native';
  view.addEventListener('change',render);
  item.addEventListener('change',render);
  render();
})();
</script>
</body>
</html>
