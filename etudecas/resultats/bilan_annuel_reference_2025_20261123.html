const selectedField=data.referenceOnly?"reference":"gien";
const colors=data.referenceOnly ? {observed:"#202830",reference:"#2162a6"} :
    {observed:"#202830",witness:"#2162a6",gien:"#bd591a"};
const fields=Object.keys(colors);
const seriesPick=elem("series"), slider=elem("week"), canvas=elem("graph");
for (let i=0;i<data.series.length;i++) seriesPick.add(new Option(data.series[i].title,String(i)));
document.title=data.title;
elem("scope").textContent=data.scope;
if (data.days<365) elem("report").hidden=true;
if (data.referenceOnly) {
  elem("witnessLegend").hidden=true;
  elem("witnessLegend").style.display="none";
  elem("experimentLegend").textContent="Simulation de référence";
  elem("experimentLegend").classList.replace("case","control");
}
let cumul=false;
let chartPoints=[],box=null;

function current(){return data.series[Number(seriesPick.value)];}
function newNode(tag,value,cls){
  const node=document.createElement(tag);
  node.textContent=value;
  if(cls) node.className=cls;
  return node;
}
function comparePoints(entry){
  if(!cumul) return entry.points;
  const total=Object.fromEntries(fields.map(field=>[field,0]));
  return entry.points.map(row=>{
    if(row.observed==null) return {date:row.date,...Object.fromEntries(fields.map(field=>[field,null]))};
    for(const field of fields) total[field]+=row[field];
    return {date:row.date,...total};
  });
}
function setupSeries(){
  const entry=current();
  if(!entry.cumulative) cumul=false;
  elem("weekly").setAttribute("aria-pressed",String(!cumul));
  elem("cumulative").setAttribute("aria-pressed",String(cumul));
  elem("cumulative").disabled=!entry.cumulative;
  elem("method").textContent=cumul ? "Cumul calculé sur les seules semaines renseignées, avec la même sélection pour les trois courbes." : entry.method;
  chartPoints=comparePoints(entry);
  const metrics=elem("metrics");
  metrics.replaceChildren();
  const cards=data.referenceOnly ? [["reference","Erreur de la simulation"]] :
      [["witness","Erreur témoin"],["gien","Erreur avec libération"]];
  for(const [field,title] of cards){
    const stat=entry.scores[field];
    const cell=newNode("span",title);
    cell.append(newNode("strong",pct(stat?.wape_pct)));
    metrics.append(cell);
  }
  const n=entry.scores[selectedField]?.n ?? 0;
  const mask=newNode("span","Relevés comparables");
  mask.append(newNode("strong",n+" / "+entry.points.length));
  metrics.append(mask);
  slider.max=chartPoints.length-1;
  selectWorst();
}
function render(){
  const screen=canvas.getBoundingClientRect(), w=screen.width,h=screen.height;
  if(w===0 || !chartPoints.length) return;
  const dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);
  const left=w>480?65:48,right=w-14,top=13,bottom=h-32;
  box={left,right};
  const numbers=chartPoints.flatMap(row=>fields.map(field=>row[field])).filter(Number.isFinite);
  const lo=Math.min(0,...numbers),hi=Math.max(1,...numbers);
  const scaleX=i=>left+(right-left)*i/Math.max(1,chartPoints.length-1);
  const scaleY=n=>top+(bottom-top)*(hi-n)/(hi-lo);
  ctx.font=(w>480?"12px":"10px")+" system-ui";
  const compact=new Intl.NumberFormat("fr-FR",{notation:"compact",maximumFractionDigits:1});
  for(let j=0;j<5;j++){
    const qty=lo+(hi-lo)*j/4,y=scaleY(qty);
    ctx.strokeStyle="#dce7ea";ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();
    ctx.textAlign="right";ctx.fillStyle="#425e6c";ctx.fillText(compact.format(qty),left-6,y+4);
  }
  const step=w>520?8:w>360?12:Math.max(12,Math.ceil(chartPoints.length/3));
  ctx.textAlign="center";
  for(let i=0;i<chartPoints.length;i+=step) ctx.fillText(shortDate.format(asDate(chartPoints[i].date)),scaleX(i),bottom+19);
  const active=Number(slider.value);
  ctx.strokeStyle="#8398a2";ctx.beginPath();ctx.moveTo(scaleX(active),top);ctx.lineTo(scaleX(active),bottom);ctx.stroke();
  for(const field of [...fields.slice(1),"observed"]){
    ctx.strokeStyle=ctx.fillStyle=colors[field];
    ctx.lineWidth=field==="witness"?3:2;
    ctx.setLineDash(field==="witness"?[5,5]:[]);
    ctx.beginPath();
    let connected=false;
    for(let i=0;i<chartPoints.length;i++){
      const n=chartPoints[i][field];
      if(n==null){connected=false;continue;}
      if(connected) ctx.lineTo(scaleX(i),scaleY(n));else ctx.moveTo(scaleX(i),scaleY(n));
      connected=true;
    }
    ctx.stroke();ctx.setLineDash([]);
    for(let i=0;i<chartPoints.length;i++){
      const n=chartPoints[i][field];
      if(n==null || (i!==active && field!=="observed")) continue;
      ctx.beginPath();ctx.arc(scaleX(i),scaleY(n),i===active?4:2.1,0,Math.PI*2);ctx.fill();
    }
  }
}
function choose(index){
  slider.value=Math.min(chartPoints.length-1,Math.max(0,index));
  const selection=Number(slider.value);
  const entry=current();
  const row=entry.points[selection], point=chartPoints[selection];
  const date=longDate.format(asDate(row.date));
  slider.setAttribute("aria-valuetext",date);
  elem("point").textContent=date;
  const values=elem("values");
  values.replaceChildren();
  const labels=data.referenceOnly ? [["observed","Observé"],["reference","Simulation"]] :
      [["observed","Observé"],["witness","Témoin"],["gien","Avec libération"]];
  for(const [field,title] of labels){
    const cell=newNode("span",title);
    const n=point[field];
    cell.append(newNode("b",quantity(n)+(n==null?"":" "+unitLabel(entry.unit)),field));
    values.append(cell);
  }
  const gap= row.observed==null ? "Relevé industriel absent." : "Écart à l’observé "+quantity(row[selectedField]-row.observed)+" "+unitLabel(entry.unit)+".";
  elem("source").textContent=gap+(row.source?" Source "+row.source+".":"");
  const detail=entry.episodes?.[row.date];
  elem("episode").textContent=detail||"";
  render();
}
function selectWorst(){
  let index=0,biggest=-1;
  current().points.forEach((row,i)=>{
    const diff=row.observed==null?-1:Math.abs(row[selectedField]-row.observed);
    if(diff>biggest){index=i;biggest=diff;}
  });
  choose(index);
}
function drawTotals(){
  const table=document.createElement("table");
  table.createCaption().textContent="Volumes simulés sur la période";
  const titles=data.referenceOnly ? ["Produit fini","Produit en usine","Livré"] :
      ["Produit fini","Produit en usine · témoin","Produit en usine · avec libération","Livré · témoin","Livré · avec libération"];
  const header=table.createTHead().insertRow();
  for(const title of titles){const cell=newNode("th",title);cell.scope="col";header.append(cell);}
  const body=table.createTBody();
  for(const [item,s] of Object.entries(data.finished)){
    const row=body.insertRow();
    row.append(newNode("th",item));
    const quantities=data.referenceOnly ? [s.reference.annual.total_of_completed,s.reference.annual.simulated_delivered] :
        [s.witness.annual.total_of_completed,s.gien.annual.total_of_completed,s.witness.annual.simulated_delivered,s.gien.annual.simulated_delivered];
    for(const q of quantities) row.insertCell().textContent=quantity(q);
  }
  elem("yearly").append(table);
  elem("yearly").append(newNode("p","Les fabrications incluent les ordres d’ouverture terminés pendant le rejeu. Les livraisons industrielles brutes ne sont pas documentées par commande.","muted"));
}
slider.addEventListener("input",()=>choose(Number(slider.value)));
elem("worst").addEventListener("click",selectWorst);
elem("weekly").addEventListener("click",()=>{cumul=false;setupSeries();});
elem("cumulative").addEventListener("click",()=>{cumul=true;setupSeries();});
seriesPick.addEventListener("change",setupSeries);
canvas.addEventListener("click",evt=>{
  if(!box) return;
  const x=evt.clientX-canvas.getBoundingClientRect().left;
  choose(Math.round((x-box.left)/(box.right-box.left)*(chartPoints.length-1)));
});
new ResizeObserver(render).observe(canvas);
setupSeries();drawTotals();
</script>
</html>
