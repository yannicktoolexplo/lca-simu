<meta charset="utf-8">

<title>Comparaison 2025 · Stocks et flux</title>
<style>
:root{font-family:system-ui,sans-serif;line-height:1.48;color:#17313e;background:#f0f5f6;--border:#d9e4e6;--accent:#086782}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1280px;margin:auto;padding:24px clamp(12px,4vw,42px) 42px}
h1{font-size:clamp(1.4rem,2.7vw,2.15rem);margin:0 0 17px;letter-spacing:-.025em}
h2{font-size:1rem;margin:0 0 10px}
p{margin:.65em 0}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
.filters{display:flex;flex-wrap:wrap;align-items:end;gap:8px 16px;margin-bottom:14px}
label{display:grid;gap:4px;font-size:.85rem;color:#3c5561;min-width:0}
select,button{font:inherit;color:#17313e;background:white;border:1px solid #aabdc4;border-radius:7px;padding:7px 10px;max-width:100%}
select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,2.25fr) minmax(285px,1fr);gap:14px;align-items:start}
#context,.note{font-size:.86rem;color:#48616b}
#context{margin:0 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 17px;font-size:.83rem;margin-bottom:6px;color:#3c5561}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:18px;height:3px;background:var(--line);border-radius:4px}
.plot{position:relative;height:clamp(290px,36vw,385px)}
canvas,#points{position:absolute;width:100%;height:100%;inset:0}
#points{pointer-events:none}
#points button{position:absolute;pointer-events:auto;border:0;background:transparent;padding:0;border-radius:1px;cursor:crosshair}
#points button:hover,#points button:focus-visible{outline:1px solid #4d96ac;outline-offset:-1px;background:#16819e12}
#date-label{font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 2px;border-bottom:1px solid #e3ebed;text-align:left;vertical-align:top;font-weight:inherit}
thead th{font-weight:650}
.num{white-space:nowrap;text-align:right}
#detail .note{overflow-wrap:anywhere;margin:10px 0 0}
#scores{margin-top:14px}
[hidden]{display:none!important}
@media(max-width:880px){.layout{grid-template-columns:1fr}}
@media(max-width:470px){main{padding-top:14px}.card{padding:11px}.filters{gap:8px}.filters label{width:100%}.filters select{width:100%}}
</style>
</head>

    <section id="detail" class="card" aria-live="polite"></section>
  </div>
  <section id="scores" class="card"></section>
</main>

  }
  function windowPoints(series, mode) {
    return series.points.filter(p=>within(p,mode) && ['observed',...mode.keys].some(key=>numeric(p[key])));
  }
  function selectWindow() {
    const mode = modes[scope.value];
    byId('context').textContent = mode.detail;
    filtered = data.series.map((series,index)=>({series,index,window:windowPoints(series,mode)}))
      .filter(item=>item.window.length > 0);
    const kinds = [...new Set(filtered.map(item=>item.series.kind))];
    options(measure,kinds.map(kind=>[kind,groups[kind] || kind]),measure.value || 'stock');
    selectMeasure();
  }
  function selectMeasure() {
    const list = filtered.filter(item=>item.series.kind===measure.value);
    const preferred = list.find(item=>item.series.pair===entry?.pair) ||
      list.find(item=>item.series.pair.includes('268967') && item.series.pair.includes('1920'));
    options(pair,list.map(item=>[String(item.index),item.series.pair]),String(preferred?.index ?? ''));
    selectSeries();
  }
  function selectSeries() {
    const mode = modes[scope.value];
    const selected = filtered.find(item=>String(item.index)===pair.value);
    const previousDate = points[current]?.date;
    entry = selected?.series;
    points = selected ? selected.window.slice().sort((a,b)=>a.date.localeCompare(b.date)) : [];
    keys = ['observed',...mode.keys];
    options(dates,points.map(point=>[point.date,dateText(point.date)]),previousDate);
    dates.disabled = !points.length;
    byId('measure-title').textContent = entry ? `${entry.label} · ${entry.unit}` : 'Aucune série documentée';
    chart.setAttribute('aria-label',entry ? `${entry.label}, ${entry.pair}, ${entry.unit}` : 'Aucune série documentée');
    const legend = byId('legend');
    legend.replaceChildren();
    for (const key of keys.filter(key=>points.some(point=>numeric(point[key])))) {
      const tag=el('span',undefined,legend);
      el('i',undefined,tag).style.setProperty('--line',models[key][1]);
      el('span',seriesLabel(key),tag);
    }
    const sameDate = points.findIndex(p=>p.date===dates.value);
    const mismatch = measuresOnCommonDates();
    selectPoint(previousDate && sameDate>=0 ? sameDate : mismatch.largest);
    renderScores(mismatch.common,mismatch.compared);
  }
  function seriesLabel(key) {
    if (key==='observed' && entry?.kind==='production_proxy') return 'Estimation par les étuis';
    return models[key][0];
  }
  function selectPoint(index, focus = false) {
    current = Math.max(0,Math.min(points.length-1,index));
    if (points[current]) dates.value = points[current].date;
    draw();
    renderDetail();
    if (focus) hitArea.querySelector('[aria-pressed=true]')?.focus();
  }
  function table(parent, columns) {
    const table = el('table',undefined,parent);
    const row=el('tr',undefined,el('thead',undefined,table));
    columns.forEach((column,index)=>{
      const header=el('th',column,row);
      header.scope='col';
      if (index>0) header.className='num';
    });
    return el('tbody',undefined,table);
  }
  function addRow(body, key, values) {
    const row=el('tr',undefined,body);
    el('th',key,row).scope='row';
    values.forEach(value=>el('td',format(value),row).className='num');
  }
  function renderDetail() {
    detail.replaceChildren();
    const point = points[current];
    if (!point) {
      el('p','Aucune valeur pour cette sélection.',detail);
      return;
    }
    el('h2',dateText(point.date),detail).id='date-label';
    const body = table(detail,['Série',entry.unit,'Écart*']);
    const observed = point.observed;
    for (const key of keys) {
      addRow(body,seriesLabel(key),[point[key],key!=='observed' && numeric(observed) && numeric(point[key]) ? point[key]-observed : null]);
    }
    el('p','* Simulation moins observation. Le tiret indique une valeur indisponible.',detail).className='note';
    const source=Array.isArray(point.source) ? point.source.filter(item=>typeof item==='string').join(' · ') : point.source;
    if (typeof source==='string' && source) el('p',source,detail).className='note';
  }
  function measuresOnCommonDates() {
    const compared=keys.filter(key=>key!=='observed');
    const common=points.filter(p=>compared.length && numeric(p.observed) && compared.every(key=>numeric(p[key])));
    if (!common.length) return {common,compared,largest:0};
    const probe=compared.at(-1);
    const largest=common.reduce((a,b)=>Math.abs(a[probe]-a.observed)>=Math.abs(b[probe]-b.observed)?a:b);
    return {common,compared,largest:points.indexOf(largest)};
  }
  function renderScores(common,compared) {
    const section=byId('scores');
    section.replaceChildren();
    section.hidden=!common.length;
    if (!common.length) return;
    el('h2','Écarts sur les dates communes',section);
    el('p',`${common.length} dates avec observation et valeur pour chaque simulation du périmètre.`,section).className='note';
    const body = table(section,['Simulation',`Écart absolu moyen (${entry.unit})`]);
    for (const key of compared) {
      addRow(body,seriesLabel(key),[common.reduce((sum,p)=>sum+Math.abs(p[key]-p.observed),0)/common.length]);
    }
  }
  function draw() {
    hitArea.replaceChildren();
    const width=chart.clientWidth, height=chart.clientHeight;
    if (!width || !height) return;
    const scale=window.devicePixelRatio || 1;
    chart.width=Math.round(width*scale);
    chart.height=Math.round(height*scale);
    const g=chart.getContext('2d');
    g.scale(scale,scale);
    if (!points.length) return;
    const numbers=points.flatMap(p=>keys.map(key=>p[key])).filter(numeric);
    const max=Math.max(...numbers), min=Math.min(...numbers);
    const pad=max===min ? Math.max(1,Math.abs(max)*0.06) : (max-min)*0.06;
    const low = min===0 ? 0 : min-pad, high = max+pad;
    const left=width<500?57:74, right=width-16, top=15, bottom=height-36;
    const first=time(points[0].date), last=time(points.at(-1).date);
    const x = p => first===last ? (left+right)/2 : left+(time(p.date)-first)*(right-left)/(last-first);
    const y = value => bottom-(value-low)*(bottom-top)/(high-low);
    const cursor=x(points[current]);
    g.fillStyle='#e4f0f2';
    g.fillRect(Math.max(left,cursor-6),top,12,bottom-top);
    g.font='11px system-ui';
    g.textAlign='right'; g.textBaseline='middle';
    const tick = new Intl.NumberFormat('fr-FR',{notation:'compact',maximumFractionDigits:2});
    for (let i=0;i<=5;i++) {
      const value=low+(high-low)*i/5, row=y(value);
      g.strokeStyle='#dbe6e9'; g.lineWidth=1;
      g.beginPath(); g.moveTo(left,row); g.lineTo(right,row); g.stroke();
      g.fillStyle='#45606b'; g.fillText(tick.format(value),left-6,row);
    }
    g.textAlign='center'; g.textBaseline='top';
    const stride=Math.max(1,Math.ceil(points.length/(width<510?5:8)));
    for (let i=0;i<points.length;i+=stride) g.fillText(dateText(points[i].date),x(points[i]),bottom+10);
    for (const key of keys) {
      const [,color,dashes]=models[key];
      g.strokeStyle=color; g.fillStyle=color; g.lineWidth=key==='observed'?2:2.4;
      g.setLineDash(dashes);
      g.beginPath();
      let previous;
      for (const point of points) {
        const value=point[key];
        if (!numeric(value)) { previous=undefined; continue; }
        if (previous && time(point.date)-time(previous.date)<=9*86400000) g.lineTo(x(point),y(value));
        else g.moveTo(x(point),y(value));
        previous=point;
      }
      g.stroke(); g.setLineDash([]);
      for (const [i,point] of points.entries()) {
        if (!numeric(point[key])) continue;
        g.beginPath(); g.arc(x(point),y(point[key]),i===current?4.8:2.7,0,Math.PI*2); g.fill();
      }
    }
    points.forEach((point,index)=>{
      const axis=x(point);
      const leftEdge=index===0?Math.max(0,axis-10):(x(points[index-1])+axis)/2;
      const rightEdge=index===points.length-1?Math.min(width,axis+10):(x(points[index+1])+axis)/2;
      const button=el('button',undefined,hitArea);
      button.type='button';
      button.dataset.date=point.date;
      button.setAttribute('aria-label',`${dateText(point.date)}. ${keys.map(key=>`${seriesLabel(key)} ${format(point[key])}`).join(', ')}`);
      button.setAttribute('aria-pressed',String(index===current));
      button.tabIndex=index===current?0:-1;
      Object.assign(button.style,{left:`${leftEdge}px`,width:`${rightEdge-leftEdge}px`,top:`${top}px`,height:`${bottom-top}px`});
      button.addEventListener('click',()=>selectPoint(index,true));
      button.addEventListener('keydown',event=>{
        if (!['ArrowLeft','ArrowRight'].includes(event.key)) return;
        event.preventDefault();
        selectPoint(index+(event.key==='ArrowLeft'?-1:1),true);
      });
    });
  }

  scope.addEventListener('change',selectWindow);
  measure.addEventListener('change',selectMeasure);
  pair.addEventListener('change',selectSeries);
  dates.addEventListener('change',()=>selectPoint(points.findIndex(point=>point.date===dates.value)));
  new ResizeObserver(draw).observe(byId('figure'));
  selectWindow();
})();
</script>
</body>
</html>
