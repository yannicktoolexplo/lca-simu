  const d = date => date?dates.format(Date.parse(date+'T00:00:00Z')):'Inconnue';
  const dayFromIndex = index => weekdays.format(Date.UTC(2025,0,1+Number(index)));
  const scopes={closing:'Revue ciblée de clôture',weekly_closing:'Revue hebdomadaire de clôture',weekly_morning:'Revue hebdomadaire du matin'};
  const key = row => `${row.review}|${row.scope||row.horizon}`;

  function add(host,tag,text,cls) {
    const el=document.createElement(tag);
    if(text!==undefined) el.textContent=text;
    if(cls) el.className=cls;
    host.append(el);
    return el;
  }
  function option(select,value,text){add(select,'option',text).value=value;}
  function table(host,headers,rows,numeric=[]){
    const grid=add(add(host,'div',undefined,'table-wrap'),'table');
    const head=add(add(grid,'thead'),'tr'), body=add(grid,'tbody');
    headers.forEach((s,i)=>{add(head,'th',s,numeric.includes(i)?'number':'').scope='col';});
    for(const values of rows) {
      const row=add(body,'tr');
      values.forEach((v,i)=>{
        const cell=add(row,i?'td':'th',numeric.includes(i)?q(v):v,numeric.includes(i)?'number':'');
        if(!i) cell.scope='row';
      });
    }
  }
  function collapsible(host,label){const node=add(host,'details');add(node,'summary',label);return node;}
  function sourceLine(host,label,cells){
    const list=Array.isArray(cells)?cells:[cells].filter(Boolean);
    if(list.length) add(host,'p',`${label} · ${list.join(' · ')}`,'source');
  }
  function protection(row) {
    const {reference,weekly}=row.scenarios;
    const counts=Object.keys(weekly.checkpoint_deficit).length;
    let conclusion='Les critères ne sont pas réunis sur cette revue.';
    if(row.passes) conclusion='Les trois critères sont réunis sur la fenêtre de cette revue.';
    if(!row.factory_window_matches_archive) conclusion='Le plan d’usine témoin diverge de l’archive. Ce cas est affiché à titre de diagnostic.';
    add(detail,'p',conclusion,row.passes?'notice good':'notice');
    add(detail,'p',`Plan à D1920 · fenêtre atteignable du ${d(row.reach_window[0])} au ${d(row.reach_window[1])}. Les résultats ci-dessous sont des projections.`,'muted');
    table(detail,['Scénario (UN)','Lancements proposés en sortie de gel','Pic journalier proposé','Total proposé sur 28 jours après le gel'],
      scenarios.map(([name,label])=>{
        const values=row.scenarios[name];
        return [label,values.at_boundary,values.peak,values.total];
      }),[1,2,3]);
    add(detail,'h3','Critères appliqués à l’essai');
    table(detail,['Critère','Résultat'],[
      ['Pic journalier en baisse',row.peak_reduced?`Oui · ${q(reference.peak)} vers ${q(weekly.peak)} UN`:'Non'],
      ['Hausse maximale du manque client projeté',`${q(row.additional_projected_shortage)} UN${row.first_extra_shortage?` · première date ${d(row.first_extra_shortage)}`:''}`],
      ['Cibles de protection satisfaites',`${q(row.safety_checkpoints_met)} sur ${q(counts)}`]
    ]);
    const daily=collapsible(detail,'Lancements proposés par date');
    const launch=scenarios.map(([name])=>new Map(row.scenarios[name].opens));
    const days=[...new Set(launch.flatMap(m=>[...m.keys()]))].sort();
    if(days.length) table(daily,['Date','Témoin (UN)','Essai (UN)','Sans protection (UN)'],
      days.map(day=>[d(day),...launch.map(m=>m.get(day)??0)]),[1,2,3]);
    else add(daily,'p','Aucun lancement proposé dans la fenêtre.');
    const targets=collapsible(detail,'Manque projeté aux dates de contrôle de la protection');
    table(targets,['Date','Témoin (UN)','Essai (UN)','Sans protection (UN)'],
      Object.keys(weekly.checkpoint_deficit).map(day=>[dayFromIndex(day),...scenarios.map(([name])=>row.scenarios[name].checkpoint_deficit[day])]),[1,2,3]);
  }
  function forecast(row) {
    add(detail,'p',`${row.horizon} semaines comparables · prévision précédente du ${d(row.prior)} et nouvelle prévision du ${d(row.review)}.`,'muted');
    add(detail,'p','La demande observée sur ces semaines est ajoutée après coup pour mesurer l’écart. Elle est connue après la revue.');
    const first=row.first_week||{};
    table(detail,['Fenêtre (UN)','Prévision précédente','Nouvelle prévision','Demande observée'],[
      ['Total de la fenêtre',row.previous_total,row.new_total,row.observed_total],
      [`Première semaine · ${d(first.target)}`,first.previous,first.new,first.observed]
    ],[1,2,3]);
    if(typeof row.alert==='boolean') add(detail,'p',row.alert?'Alerte détectée sur les dernières semaines connues à la revue.':'Aucune alerte sur les dernières semaines connues à la revue.','muted');
    if(row.weeks?.length) {
      const weeks=collapsible(detail,'Prévisions et demande semaine par semaine');
      table(weeks,['Semaine','Prévision précédente (UN)','Nouvelle prévision (UN)','Demande observée (UN)'],
        row.weeks.map(w=>[d(w.target),w.previous,w.new,w.observed]),[1,2,3]);
    }
    const references=collapsible(detail,'Cellules des prévisions et de la demande');
    add(references,'p','Flow_Data_Customer_Demand.xlsx','source');
    sourceLine(references,'Prévision précédente',row.prior_cells);
    sourceLine(references,'Nouvelle prévision',row.new_cells);
    sourceLine(references,'Demande observée',row.observed_cells);
  }
  function industry(row) {
    add(detail,'p',`Version industrielle à D1920 · ${row.horizon} semaines. Les entrées et besoins proviennent du plan. Les minima ci-dessous sont calculés sur cette fenêtre.`,'muted');
    table(detail,['Indicateur de plan','UN'],[
      ['Total des entrées prévues',row.incoming_total],
      ['Minimum projeté sans les entrées prévues',row.min_without_receipts],
      ['Minimum projeté avec les entrées prévues',row.min_with_receipts]
    ],[1]);
    add(detail,'h3','Lignes du MRP par semaine');
    table(detail,['Semaine','Entrées prévues (UN)','Besoins prévus (UN)','Stock inscrit au plan (UN)','Clôture calculée (UN)','Solde sans entrées (UN)','Cellule'],
      row.rows.map(r=>[d(r.week),r.receipt,r.need,r.physical,r.closing,r.without_receipts,r.cell]),[1,2,3,4,5]);
    add(detail,'p','Flow_Data_MRP_results.xlsx','source');
    add(detail,'p','Une entrée prévue n’établit ni sa réception physique ni la disponibilité client.','muted');
  }
  const renderers={protection,forecast,industry};
  let rows=[];
  function render() {
    detail.replaceChildren();
    const row=rows.find(r=>key(r)===picker.value);
    if(!row){add(detail,'p','Aucun cas dans cette sélection.');return;}
    add(detail,'h2',`${row.item} · ${d(row.review)}`);
    renderers[view.value](row);
  }
  function resetCases(preferred) {
    rows=data.groups[view.value].filter(r=>r.item===item.value)
      .sort((a,b)=>a.review.localeCompare(b.review)||key(a).localeCompare(key(b)));
    picker.replaceChildren();
    for(const row of rows) option(picker,key(row),`${d(row.review)} · ${scopes[row.scope]||`${row.horizon} semaines`}`);
    const first=rows.find(r=>key(r)===preferred)||rows.find(r=>r.passes)||rows.find(r=>r.factory_window_matches_archive)||rows[0];
    if(first) picker.value=key(first);
    const info=view.value==='protection'?` · ${q(data.comparable)} témoins concordants avec l’archive · ${q(data.accepted)} ${data.accepted===1?'revue':'revues'} avec critères réunis`:'';
    id('coverage').textContent=`${q(data.counts[view.value])} cas au total · ${q(rows.length)} pour ce produit${info}.`;
    render();
  }
  function resetItems() {
    const preferred=item.value;
    const articles=[...new Set(data.groups[view.value].map(r=>r.item))].sort();
    item.replaceChildren();
    for(const article of articles) option(item,article,`${article} · ${locations[article]||'site inconnu'}`);
    if(articles.includes(preferred)) item.value=preferred;
    resetCases();
  }
  view.addEventListener('change',resetItems);
  item.addEventListener('change',()=>resetCases(picker.value));
  picker.addEventListener('change',render);
  resetItems();
})();
</script>
</body>
</html>
