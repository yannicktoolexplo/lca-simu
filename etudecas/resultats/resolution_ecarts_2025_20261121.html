<script>
(() => {
  'use strict';
  const id = name => document.getElementById(name);
  const data = JSON.parse(id('diagnostic-data').textContent);
  const mode = id('view'), item = id('item'), report = id('report');
  const numeric = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:3});
  const compact = new Intl.NumberFormat('fr-FR',{notation:'compact',maximumFractionDigits:1});
  const labelDate = new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
  const shortDate = new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',timeZone:'UTC'});
  const oneDay = 86400000;
  const time = iso => Date.parse(iso+'T00:00:00Z');
  const sites = {'1810':'Avène','1430':'Gien','1450':'Gaillac','1920':'Muret'};
  const isNumber = value => typeof value==='number'&&Number.isFinite(value);
  const qty = value => isNumber(value)?numeric.format(value):'Inconnu';
  const d = iso => iso==='2024-12-30'?'1er au 5 janvier 2025':labelDate.format(time(iso));
  const stockModes = {purchases:'Dates des achats initiaux',release:'Contrôle unique des produits finis'};
  const modeDefaults = {purchases:'1430/042342',release:'1920/268091'};
  const productionLines = [
    ['observed','Étuis prélevés observés (équivalent PF)','#263942',false],
    ['physical','Fins physiques simulées au site','#176e7a',false],
    ['released','Produits fabriqués devenus utilisables au site','#ae5004',true]
  ];
  const stockLines = [
    ['observed','Stock physique observé','#263942',false],
    ['witness','Stock physique simulé · témoin','#176e7a',false],
    ['trial','Stock physique simulé · essai','#ae5004',true]
  ];
  let resize;

  function add(parent,tag,text,cls) {
    const el=document.createElement(tag);
    if(text!==undefined) el.textContent=text;
    if(cls) el.className=cls;
    parent.append(el);
    return el;
  }
  function option(select,value,label) {
    add(select,'option',label).value=value;
  }
  function table(parent, headers, rows) {
    const tab=add(add(parent,'div',undefined,'table-wrap'),'table');
    const head=add(add(tab,'thead'),'tr'), body=add(tab,'tbody');
    headers.forEach((label,index)=>add(head,'th',label,index?'number':'').scope='col');
    rows.forEach(values=>{
      const row=add(body,'tr');
      add(row,'th',values[0]).scope='row';
      values.slice(1).forEach(value=>add(row,'td',qty(value),'number'));
    });
  }
  function graph(host,rows,fields,chosen,select){
    const canvas=add(host,'canvas');
    canvas.id='trend';
    canvas.setAttribute('role','img');
    canvas.setAttribute('aria-label','Valeurs hebdomadaires. Les dates et valeurs sont accessibles depuis le sélecteur de semaine.');
    const ctx=canvas.getContext('2d');
    if (!ctx) return ()=>{};
    const first=time(rows[0].date), last=Math.max(first+oneDay,time(rows.at(-1).date));
    const axis=rows.flatMap(row=>fields.map(([key])=>row[key])).filter(isNumber);
    const min=Math.min(0,...axis), max=Math.max(1,...axis);
    const scale=10**Math.floor(Math.log10((max-min)/4));
    const tick=[1,2,5,10].find(n=>n*scale>=(max-min)/4)*scale;
    const low=Math.floor(min/tick)*tick, high=Math.ceil(max/tick)*tick;
    let x;
    function draw(){
      const {width,height}=canvas.getBoundingClientRect();
      if(!width||!height) return;
      const ratio=window.devicePixelRatio||1;
      canvas.width=Math.round(width*ratio);
      canvas.height=Math.round(height*ratio);
      ctx.setTransform(ratio,0,0,ratio,0,0);
      ctx.font='11px system-ui, sans-serif';
      const left=Math.max(46,ctx.measureText(compact.format(high)).width+10), right=width-12;
      const top=12, bottom=height-28;
      x=day=>left+(time(day)-first)/(last-first)*(right-left);
      const y=n=>bottom-(n-low)/(high-low)*(bottom-top);
      ctx.fillStyle='#4d6675';
      ctx.textAlign='right';
      ctx.textBaseline='middle';
      ctx.strokeStyle='#d9e5e9';
      for(let index=0;index<=Math.round((high-low)/tick);index++){
        const value=low+index*tick;
        ctx.beginPath();
        ctx.moveTo(left,y(value));
        ctx.lineTo(right,y(value));
        ctx.stroke();
        ctx.fillText(compact.format(value),left-7,y(value));
      }
      const interval=Math.max(1,Math.ceil(rows.length/Math.max(2,Math.floor(width/80))));
      ctx.textAlign='center';
      rows.filter((_,i)=>i%interval===0).forEach(row=>{
        const text=row.date==='2024-12-30'?'1 janv.':shortDate.format(time(row.date));
        const half=ctx.measureText(text).width/2;
        ctx.fillText(text,Math.min(x(row.date),width-half-2),bottom+14);
      });
      ctx.strokeStyle='#889fa9';
      ctx.setLineDash([3,3]);
      ctx.beginPath();
      ctx.moveTo(x(chosen.value),top);
      ctx.lineTo(x(chosen.value),bottom);
      ctx.stroke();
      for (const [key,,color,dashed] of fields) {
        ctx.lineWidth=2;
        ctx.strokeStyle=color;
        ctx.fillStyle=color;
        ctx.setLineDash(dashed?[6,4]:[]);
        ctx.beginPath();
        let previous=null;
        for (const row of rows) {
          if(!isNumber(row[key])) { previous=null; continue; }
          if(previous && time(row.date)-time(previous)<=7*oneDay) ctx.lineTo(x(row.date),y(row[key]));
          else ctx.moveTo(x(row.date),y(row[key]));
          previous=row.date;
        }
        ctx.stroke();
        for(const row of rows){
          if(!isNumber(row[key])) continue;
          ctx.beginPath();
          ctx.arc(x(row.date),y(row[key]),chosen.value===row.date?4:2.5,0,2*Math.PI);
          ctx.fill();
        }
      }
    }
    canvas.addEventListener('click',ev=>{
      if(!x) return;
      const pos=ev.clientX-canvas.getBoundingClientRect().left;
      const nearest=rows.reduce((best,row)=>Math.abs(x(row.date)-pos)<Math.abs(x(best.date)-pos)?row:best);
      if(Math.abs(x(nearest.date)-pos)<=14) select(nearest.date);
    });
    resize=new ResizeObserver(draw);
    resize.observe(canvas);
    draw();
    return draw;
  }
  function layout(heading, context, rows, fields, initial, show) {
    add(report,'h2',heading);
    add(report,'p',context,'muted');
    const legend=add(report,'div',undefined,'legend');
    fields.forEach(([,label,color,dashed])=>add(legend,'span',label,dashed?'dashed':'').style.setProperty('--color',color));
    const chart=add(report,'div');
    add(report,'p','Sélectionner un point ou une date. Les semaines sans relevé industriel interrompent la courbe observée.','muted');
    const week=add(report,'label','Date du relevé','week');
    const chosen=add(week,'select');
    chosen.id='week';
    rows.forEach(row=>option(chosen,row.date,d(row.date)));
    chosen.value=initial;
    const detail=add(report,'section');
    detail.id='week-detail';
    detail.setAttribute('aria-live','polite');
    const draw=graph(chart,rows,fields,chosen,pick);
    function pick(date) {
      chosen.value=date;
      detail.replaceChildren();
      add(detail,'h2',d(date));
      show(detail,rows.find(row=>row.date===date));
      draw();
    }
    chosen.addEventListener('change',()=>pick(chosen.value));
    pick(initial);
  }
  function displayProduction() {
    const {rows,metrics,site,bom}=data.production.products[item.value];
    const largest=rows.filter(row=>isNumber(row.observed)).reduce((a,b)=>Math.abs(b.physical-b.observed)>Math.abs(a.physical-a.observed)?b:a);
    const context=`Du 1er janvier au 1er juin 2025 · ${metrics.weeks} semaines documentées. Écart moyen aux étuis : ${qty(metrics.published_mae)} UN à la date d’utilisation, ${qty(metrics.physical_mae)} UN à la fin physique.`;
    layout(`${item.value} · ${sites[site.slice(2)]} · unités par semaine`,context,rows,productionLines,largest.date,(detail,row)=>{
      table(detail,['Mesure','UN'],[
        ['Étuis prélevés observés (équivalent PF)',row.observed],['Fins physiques simulées au site',row.physical],
        ['Dont ordres déjà ouverts au départ',row.opening],['Produits fabriqués devenus utilisables au site',row.released],
        ['Écart fin physique moins étuis',isNumber(row.observed)?row.physical-row.observed:null]
      ]);
      add(detail,'p',row.source?`Mouvements · Flow_Data_Inventory_movements.xlsx!${row.source} · Étui ${metrics.proxy_component} · Nomenclature ${bom}`:'Aucun prélèvement industriel exploitable sur cette semaine.','muted sources');
      add(detail,'p',`Simulation · ${data.production.event_source} et ${data.production.release_source}. Les étuis renseignent une estimation de production, les libérations ne créent aucune unité supplémentaire.`,'muted sources');
    });
  }
  function displayStocks() {
    const scenario=data.comparisons[mode.value];
    const entry=scenario.stocks[item.value];
    const [site,article]=item.value.split('/');
    const rows=entry.photos.map(photo=>({date:photo.photo,observed:photo.real,witness:photo.witness[0],trial:photo.trial[0],photo}));
    const range=entry.periods.all;
    const context=`${scenario.days} jours simulés · ${range.n} relevés. Écart moyen au stock observé : ${qty(range.witness_mae)} ${entry.unit} pour le témoin, ${qty(range.trial_mae)} ${entry.unit} pour l’essai.`;
    const largest=rows.reduce((a,b)=>Math.abs(b.witness-b.trial)>Math.abs(a.witness-a.trial)?b:a);
    layout(`${article} · ${sites[site]||site} · ${entry.unit}`,context,rows,stockLines,largest.date,(detail,row)=>{
      const labels=['Stock physique','Part utilisable','Part en contrôle','Part réservée'];
      table(detail,[`Stock (${entry.unit})`,'Observé','Témoin','Essai'],labels.map((label,i)=>[label,i===0?row.observed:null,row.photo.witness[i],row.photo.trial[i]]));
      add(detail,'p',`Relevé · Flow_Data_Inventory_and_Replenishment_rules.xlsx!${row.photo.cell}`,'muted sources');
    });
  }
  function render() {
    resize?.disconnect();
    report.replaceChildren();
    if(mode.value==='production') displayProduction();
    else displayStocks();
  }
  function resetItems() {
    item.replaceChildren();
    if(mode.value==='production') {
      for(const [key,product] of Object.entries(data.production.products)) option(item,key,`${key} · ${sites[product.site.slice(2)]}`);
    } else {
      for(const key of Object.keys(data.comparisons[mode.value].stocks)){
        const [site,article]=key.split('/');
        option(item,key,`${article} · ${sites[site]||site}`);
      }
      if([...item.options].some(o=>o.value===modeDefaults[mode.value])) item.value=modeDefaults[mode.value];
    }
    render();
  }
  for(const key of Object.keys(data.comparisons)) {
    if(Object.keys(data.comparisons[key].stocks).length) option(mode,key,stockModes[key]);
  }
  mode.addEventListener('change',resetItems);
  item.addEventListener('change',render);
  resetItems();
})();
