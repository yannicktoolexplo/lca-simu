<script>
(() => {
  'use strict';
  const evidence=JSON.parse(document.querySelector('#evidence').textContent);
  const product=document.querySelector('#product'),period=document.querySelector('#period');
  const chartHost=document.querySelector('#charts'),scoreHost=document.querySelector('#score');
  const experiments=document.querySelector('#experiments');
  const css=getComputedStyle(document.documentElement);
  const colors=Object.fromEntries(['real','prior','trial','secondary','third','muted','line'].map(k=>[k,css.getPropertyValue('--'+k).trim()]));
  const integers=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2});
  const percentages=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const dates=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',timeZone:'UTC'});
  const totalDate=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
  const abbr=new Intl.NumberFormat('fr-FR',{notation:'compact',maximumFractionDigits:1});
  const number=x=>x===null||x===undefined?'—':integers.format(x);
  const percent=x=>x===null||x===undefined?'—':percentages.format(x)+' %';
  const relative=r=>r.delta_pct??(r.observed&&Number.isFinite(r.candidate)?100*(r.candidate-r.observed)/Math.abs(r.observed):null);
  const dateLabel=(s,f=dates)=>f.format(new Date(s+'T00:00:00Z'));
  const add=(host,tag,label,c)=>{const n=document.createElement(tag);if(c)n.className=c;if(label!==undefined)n.textContent=label;host.append(n);return n;};
  const names={all:'Janvier à juin',D1810_march:'17 février au 16 mars',D1810_may:'12 mai au 1er juin',D1430_march:'10 mars au 20 avril'};
  const formats=[
    {key:'observed',color:'real',label:'Observé'},
    {key:'reference',color:'prior',label:'Scénario précédent',dash:[6,4]},
    {key:'candidate',color:'trial',label:'Dernier candidat'}
  ];
  let observers=[];
  function table(host,headers,values,numeric=[]){
    const frame=add(host,'div',undefined,'table-frame'),t=add(frame,'table');
    const head=add(add(t,'thead'),'tr');
    headers.forEach((v,i)=>add(head,'th',v,numeric.includes(i)?'num':undefined));
    const body=add(t,'tbody');
    for(const line of values){
      const row=add(body,'tr');
      line.forEach((v,i)=>add(row,i===0?'th':'td',v,numeric.includes(i)?'num':undefined));
    }
    return t;
  }
  function plot(host,series,rows){
    const wrap=add(host,'div',undefined,'canvas-wrap');
    const cv=add(wrap,'canvas');cv.setAttribute('role','img');cv.tabIndex=0;
    cv.setAttribute('aria-label','Courbe hebdomadaire interactive');
    const selection=add(host,'p',undefined,'readout');selection.setAttribute('aria-live','polite');
    const ctx=cv.getContext('2d');
    let index=rows.findIndex(r=>r.observed!==null&&r.observed!==undefined);
    if(index<0) index=0;
    let xFor=i=>0;
    function draw(){
      if(!rows.length)return;
      const width=cv.clientWidth,height=cv.clientHeight;
      if(!width||!height)return;
      const density=Math.max(1,window.devicePixelRatio||1);
      cv.width=Math.round(width*density);cv.height=Math.round(height*density);
      ctx.setTransform(density,0,0,density,0,0);
      const left=55,right=width-18,top=13,bottom=height-31;
      const peak=Math.max(1,...series.flatMap(s=>rows.map(r=>r[s.key]??0)));
      const exponent=Math.pow(10,Math.floor(Math.log10(peak/4)));
      const snapped=Math.ceil((peak/4)/exponent)*exponent;
      const extent=snapped*4;
      xFor=i=>rows.length===1?(left+right)/2:left+(right-left)*i/(rows.length-1);
      const yFor=v=>bottom-(bottom-top)*v/extent;
      ctx.font='11px system-ui';ctx.textBaseline='middle';
      for(let i=0;i<=4;i++){
        const y=yFor(i*snapped);
        ctx.beginPath();ctx.strokeStyle=colors.line;ctx.lineWidth=1;
        ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();
        ctx.fillStyle=colors.muted;ctx.textAlign='right';ctx.fillText(abbr.format(i*snapped),left-7,y);
      }
      const step=Math.max(1,Math.ceil(rows.length/Math.max(2,Math.floor((right-left)/63))));
      rows.forEach((r,i)=>{
        if(i%step!==0)return;
        ctx.fillStyle=colors.muted;ctx.textAlign='center';ctx.fillText(dateLabel(r.date),xFor(i),bottom+17);
      });
      ctx.strokeStyle='#9fb2c9';ctx.beginPath();ctx.moveTo(xFor(index),top);ctx.lineTo(xFor(index),bottom);ctx.stroke();
      for(const s of series){
        ctx.strokeStyle=colors[s.color];ctx.lineWidth=s.key==='observed'?2.4:2;ctx.setLineDash(s.dash??[]);
        ctx.beginPath();
        let joined=false;
        rows.forEach((r,i)=>{
          const v=r[s.key];if(v===null||v===undefined){joined=false;return;}
          const x=xFor(i),y=yFor(v);
          if(joined)ctx.lineTo(x,y);else ctx.moveTo(x,y);joined=true;
        });
        ctx.stroke();ctx.setLineDash([]);
        rows.forEach((r,i)=>{
          if(r[s.key]===null||r[s.key]===undefined)return;
          ctx.beginPath();ctx.fillStyle=colors[s.color];
          ctx.arc(xFor(i),yFor(r[s.key]),i===index?4:2.3,0,Math.PI*2);ctx.fill();
        });
      }
      const selected=rows[index];
      let text=dateLabel(selected.date,totalDate)+' · '+series.map(s=>s.label+' '+number(selected[s.key])).join(' · ');
      const difference=relative(selected);
      if(difference!==null)text+=' · Écart '+percent(difference);
      else if(selected.observed===0)text+=' · Base observée nulle';
      if(selected.source)text+=' · '+selected.source;
      selection.textContent=text;
    }
    cv.addEventListener('click',e=>{
      const x=e.clientX-cv.getBoundingClientRect().left;
      index=rows.reduce((best,_,i)=>Math.abs(xFor(i)-x)<Math.abs(xFor(best)-x)?i:best,0);draw();
    });
    cv.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      e.preventDefault();index=Math.min(rows.length-1,Math.max(0,index+(e.key==='ArrowLeft'?-1:1)));draw();
    }});
    const watcher=new ResizeObserver(draw);watcher.observe(wrap);observers.push(watcher);
    draw();
  }
  function chart(block,rows,keys,hint){
    const box=add(chartHost,'section',undefined,'card');box.dataset.series=block.id;
    add(box,'h2',block.title);
    if(hint)add(box,'p',hint,'small');
    const legend=add(box,'div',undefined,'legend');
    for(const s of keys){
      const tag=add(legend,'span',undefined,'leg legend-'+s.color);
      add(tag,'span',undefined,'swatch').style.borderColor=colors[s.color];
      add(tag,'span',s.label);
    }
    plot(box,keys,rows);
    const detail=add(box,'details');add(detail,'summary','Valeurs et écarts par semaine');
    const canCompare=keys.some(c=>c.key==='observed');
    const headers=['Date',...keys.map(s=>s.label),...(canCompare?[block.diffLabel??'Écart du candidat','Source']:[])];
    const lines=rows.map(r=>[dateLabel(r.date,totalDate),...keys.map(s=>number(r[s.key])),
      ...(canCompare?[r.observed===0?'Base nulle':percent(relative(r)),r.source??'—']:[])]);
    table(detail,headers,lines,keys.map((_,i)=>i+1));
  }
  function showTests(){
    experiments.replaceChildren();
    const test=evidence.tests[product.value];
    add(experiments,'h2',test.title);
    for(const p of test.paragraphs)add(experiments,'p',p);
    for(const t of test.tables){
      const detail=add(experiments,'details');add(detail,'summary',t.title);
      table(detail,t.columns,t.rows,t.numeric??[]);
    }
  }
  function render(){
    for(const observer of observers)observer.disconnect();
    observers=[];chartHost.replaceChildren();scoreHost.replaceChildren();
    const p=product.value,win=period.value,short=p==='D1810'?['D1810_production','D1810_D1920']:['D1430_production','D1430_D1920','D1430_042342'];
    const item=p==='D1810'?'268091':'268967';
    const [lo,hi]=evidence.windows[win];
    const inWindow=r=>lo<=r.date&&r.date<=hi;
    const name=win==='all'?'all':win==='D1810_may'?'may':'march';
    add(scoreHost,'h2','Écarts au réel sur les dates communes');
    add(scoreHost,'p','L’erreur absolue additionne les écarts et les rapporte aux quantités observées. Le biais garde leur signe. Le stock simulé est relevé en fin de dimanche, avant la photo du lundi.','small');
    table(scoreHost,['Mesure','Dates communes','Erreur précédente','Erreur candidat','Biais candidat'],
      short.map(id=>{
        const s=evidence.series[id],{reference,candidate}=s.metrics[name];
        return [s.title,number(candidate.n),percent(reference.wape),percent(candidate.wape),percent(candidate.bias)];
      }),[1,2,3,4]);
    for(const id of short){
      const s=evidence.series[id];
      const observedLabel=s.observed_basis==='relevé physique'?'Photo industrielle':'Réel estimé par les étuis';
      chart({...s,id},s.values.filter(inWindow),[{...formats[0],label:observedLabel},...formats.slice(1)],
        s.observed_basis==='relevé physique'?'Unités · stock physique aux relevés du lundi.':'Unités · fins physiques simulées, dont carnet initial. L’estimation industrielle provient des étuis.');
    }
    if(p==='D1810'){
      chart({id:'origines',title:'Réceptions et libérations simulées à D1920'},evidence.simulated_receipts[item].filter(inWindow),[
        {key:'total',color:'trial',label:'Total reçu'},
        {key:'opening',color:'secondary',label:'Carnet initial reçu'},
        {key:'new',color:'prior',label:'Nouveaux lots reçus',dash:[6,4]},
        {key:'released_at_D1920',color:'third',label:'Volume rendu utilisable'}
      ],'Unités · les départs et réceptions industriels bruts par lot ne sont pas documentés.');
    }else{
      chart({id:'D1430_transfert',title:'Effet du transfert du lot sur le stock de D1920',diffLabel:'Écart du départ immédiat'},
        evidence.D1430_transfer_chart,[
          {...formats[0],label:'Photo industrielle'},
          {...formats[2],label:'Départ immédiat'},
          {key:'plus_7',color:'prior',label:'Départ +7 jours',dash:[6,4]},
          {key:'plus_14',color:'secondary',label:'Départ +14 jours'},
          {key:'held_at_plant',color:'third',label:'Lot gardé à D1430',dash:[3,4]}
        ],'11 photos communes du 17 mars au 26 mai. Essai à volume de lot et sorties clients du scénario conservés.');
      const s=evidence.short_receipt_experiment;
      chart({...s,id:'D1430_96'},s.values,[
        {...formats[0],label:'Photo industrielle'},{...formats[1],label:'Témoin de 96 jours'},{...formats[2],label:'Réceptions révisées'}
      ],'Fenêtre distincte de 96 jours · erreur absolue sur 14 photos '+
        percent(s.metrics.all.reference.wape)+' → '+percent(s.metrics.all.candidate.wape)+'.');
    }
    showTests();
  }
  function reset(){
    const p=product.value;
    period.replaceChildren();
    const choices=p==='D1810'?['all','D1810_march','D1810_may']:['all','D1430_march'];
    for(const k of choices)add(period,'option',names[k]).value=k;
    period.value=p==='D1810'?'D1810_may':'D1430_march';render();
  }
  product.addEventListener('change',reset);period.addEventListener('change',render);
  reset();
})();
</script>
