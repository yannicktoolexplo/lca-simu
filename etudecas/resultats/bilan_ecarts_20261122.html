<script>
(() => {
  'use strict';
  const data=JSON.parse(document.getElementById('gap-data').textContent);
  const content=document.getElementById('content'), tabs=[...document.querySelectorAll('[data-view]')];
  const n=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2});
  const date=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
  const q=v=>Number.isFinite(v)?n.format(v):'Inconnu';
  const pc=v=>Number.isFinite(v)?`${q(v)} %`:'Non défini';
  const d=v=>v?date.format(Date.parse(v+'T00:00:00Z')):'—';
  const day=v=>Number.isFinite(v)?date.format(Date.UTC(2025,0,1+v)):'—';
  const sites={'1430':'Gien','1450':'Gaillac','1810':'Avène','1920':'Muret','1820':'1820'};
  const kinds={stock:'Stock physique',net:'Mouvement net',inbound:'Entrées',consumption:'Prélèvements de composants',
   cartons:'Étuis dédiés',demand:'Demande publiée',production_proxy:'Fins physiques comparées aux étuis'};
  const plans={control:'Témoin',v7:'V7',candidate:'Candidat',annual:'Historique annuel',annual_nominal:'Historique annuel',witness:'V7'};
  const coverageNames={confirmed_purchase_orders:'Ordres d’achat et ordres initiaux',physical_customer_deliveries:'Livraisons clients physiques',
    CA_lost:'Chiffre d’affaires perdu',transit:'Départs, transit et réceptions',availability_and_quality:'Disponibilité et contrôle qualité',
    stock_valuation_and_costs:'Valorisation et coûts de stock'};
  const coverageLimits={confirmed_purchase_orders:'Les dates des engagements à l’ouverture sont prévues. Les réceptions réalisées demandent un rapprochement indépendant.',
    physical_customer_deliveries:'Les livraisons simulées sont datées. Les départs et livraisons bruts industriels manquent pour un rapprochement.',
    CA_lost:'Les montants observés sont en valeur et ne donnent pas de quantité livrée ou manquante.',
    transit:'Les lots simulés ont une filiation. Les trajets et réceptions industriels ne sont pas identifiables au lot.',
    availability_and_quality:'Les rubriques courant et futur du MRP bornent un classement planifié. Les libérations exactes restent inconnues.',
    stock_valuation_and_costs:'La valorisation source ne précise pas les mêmes sites et phases que les coûts du modèle.'};
  const labelPair=pair=>{const [site,article]=pair.split('/');return `${article} · ${sites[site]||site}`;};
  const family=pair=>data.families[pair.split('/')[1]]||'Non classé';
  const pairId=row=>`${row[4].split('-').at(-1)}/${row[5]}`;
  const unique=values=>[...new Set(values)].sort();
  function add(host,tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;host.append(e);return e;}
  function panel(host){return add(host,'section',undefined,'panel');}
  function fold(host,text){const node=add(host,'details');add(node,'summary',text);return node;}
  function select(parent,label,id,options){
    const wrap=add(parent,'label',label), field=add(wrap,'select');field.id=id;
    for(const [key,title] of options) add(field,'option',title).value=key;
    return field;
  }
  function table(host,headings,rows,numeric=[]){
    const grid=add(add(host,'div',undefined,'table-wrap'),'table');
    const head=add(add(grid,'thead'),'tr'),body=add(grid,'tbody');
    headings.forEach((title,i)=>{add(head,'th',title,numeric.includes(i)?'num':'').scope='col';});
    for(const values of rows){
      const row=add(body,'tr');
      values.forEach((value,i)=>{
        const cell=add(row,i?'td':'th',value instanceof Node?undefined:numeric.includes(i)?q(value):value,numeric.includes(i)?'num':'');
        if(value instanceof Node)cell.append(value);
        if(!i)cell.scope='row';
      });
    }
  }
  function summary(){
    const box=panel(content); add(box,'h2','Comparaison sur les mêmes semaines observées');
    add(box,'p',`${data.entries.length} séries recensées. Les trois scénarios courts couvrent les mêmes 152 jours. Les 365 jours historiques se consultent séparément dans chaque fiche.`);
    table(box,['Mesure','Séries appariées','Relevés','WAPE témoin moyen','WAPE candidat moyen','En progrès','Dégradées'],
      Object.entries(data.summary.common).map(([kind,v])=>[kinds[kind],v.series,v.points,pc(v.means.control),pc(v.means.candidate),
        v.changes.control_to_candidate.better,v.changes.control_to_candidate.worse]),[1,2,5,6]);
    add(box,'p','Le WAPE rapporte la somme des écarts absolus à la somme des valeurs absolues observées. Il reste indéfini si la série observée est entièrement à zéro. Le biais est l’écart signé rapporté au même total.','muted');
    const covers=panel(content);add(covers,'h2','Couverture et limites de comparaison');
    table(covers,['Famille de données','Ce que permettent les sources'],Object.entries(coverageNames).map(([key,label])=>[label,coverageLimits[key]]));
    const orders=data.coverage.confirmed_purchase_orders.represented_opening_positions;
    const qa=data.coverage.availability_and_quality.stock_mrp_source_diagnostic;
    add(covers,'p',`${orders.total_represented_positions} engagements initiaux représentés sur ${orders.source_rows}. ${qa.complete_splits} classements stock courant/futur lisibles dans le MRP, dont ${qa.nonzero_future_stock} avec un stock futur positif.`,'muted');
  }
  function scores(host,row){
    function line([name,v]){return [plans[name],v?.[0],pc(v?.[1]),pc(v?.[2]),v?.[3],v?.[4],v?.[5]];}
    const titles=['Scénario','Relevés','WAPE','Biais',`Erreur moyenne (${row.unit})`,'Somme observée','Somme simulée'];
    table(host,titles,Object.entries(row.common).map(line),[1,4,5,6]);
    if(row.annual){const h=fold(host,'Référence historique · 365 jours');table(h,titles,[line(['annual',row.annual])],[1,4,5,6]);}
    const late=fold(host,'Sous-période après le 7 mai');table(late,titles,Object.entries(row.late).map(line),[1,4,5,6]);
  }
  function series(){
    const bar=add(content,'div',undefined,'filters');
    const fam=select(bar,'Famille','family',[['','Toutes'],...unique(data.entries.map(r=>family(r.pair))).map(v=>[v,v])]);
    const site=select(bar,'Site','site',[['','Tous'],...Object.entries(sites)]);
    const kind=select(bar,'Mesure','kind',[['','Toutes'],...Object.entries(kinds)]);
    const outcome=select(bar,'Écart','outcome',[['','Tous'],['better','En progrès'],['worse','Dégradés'],['equal','Identiques'],['zero','Réel strictement nul'],['absent','Comparaison absente']]);
    const query=add(add(bar,'label','Article'),'input');query.id='search';query.type='search';query.size=9;
    const layout=add(content,'div',undefined,'series-layout'), list=panel(layout), info=panel(layout);
    const count=add(list,'h2');count.id='series-count';
    const options=add(list,'div',undefined,'scroll');options.id='series-list';info.id='series-detail';
    let chosen=data.entries.find(r=>r.kind==='stock'&&r.pair==='1920/268091');
    function record(){
      info.replaceChildren();
      if(!chosen){add(info,'p','Aucune série dans cette sélection.');return;}
      const r=chosen;
      add(info,'h2',`${labelPair(r.pair)} · ${r.label}`);
      add(info,'p',`${family(r.pair)} · ${r.unit} · ${r.method}`,'muted');
      scores(info,r);
      if(r.common.candidate&&r.common.candidate[1]===null) add(info,'p','Réel strictement nul sur les semaines comparables. Consulter l’écart en quantité et les valeurs simulées.','muted');
      const split=kinds[r.kind]&&data.split.candidate[r.pair.split('/')[1]];
      if(r.kind==='production_proxy'&&split) add(info,'p',`Candidat · ${q(split.new_finished_lots.in_horizon)} UN de nouveaux lots et ${q(split.initial_order_physical_outputs.in_horizon)} UN issues des ordres initiaux sur 152 jours.`);
      const scope=select(add(info,'div',undefined,'filters'),'Semaines','point-scope',[['common','Comparaison 152 jours'],['annual','Historique annuel']]);
      const points=add(info,'div');points.id='weeks';
      function through(){
        points.replaceChildren();
        const yearly=scope.value==='annual';
        const selected=r.points.filter(p=>yearly?Number.isFinite(p[5]):p.slice(2,5).every(Number.isFinite));
        if(!selected.length){add(points,'p','Aucun relevé comparable sur cette période.');return;}
        table(points,yearly?['Date',`Observé (${r.unit})`,'Historique','Cellule']:
          ['Date',`Observé (${r.unit})`,'Témoin','V7','Candidat','Cellule'],selected.map(p=>yearly?[d(p[0]),p[1],p[5],p[6]]:
          [d(p[0]),p[1],p[2],p[3],p[4],p[6]]),yearly?[1,2]:[1,2,3,4]);
      }
      scope.addEventListener('change',through);through();
    }
    function change(r){
      const c=r.common.candidate,w=r.common.control;
      if(!c||!w)return 'absent';
      if(c[1]===null)return 'zero';
      const delta=c[1]-w[1];return Math.abs(delta)<1e-6?'equal':delta<0?'better':'worse';
    }
    function refresh(){
      const list=data.entries.filter(r=>(!fam.value||family(r.pair)===fam.value)&&(!site.value||r.pair.startsWith(site.value+'/'))
        &&(!kind.value||r.kind===kind.value)&&(!outcome.value||change(r)===outcome.value)&&(!query.value||r.pair.includes(query.value.trim())));
      if(!list.includes(chosen)) chosen=list[0];
      count.textContent=`${list.length} séries`;
      options.replaceChildren();
      const buttons=[];
      table(options,['Article · mesure','WAPE candidat'],list.map(r=>{
        const btn=document.createElement('button');btn.type='button';btn.dataset.series=r.kind+'|'+r.pair;
        btn.textContent=`${labelPair(r.pair)} · ${kinds[r.kind]}`;btn.setAttribute('aria-pressed',String(r===chosen));buttons.push(btn);
        btn.addEventListener('click',()=>{chosen=r;buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===btn)));record();});
        return [btn,pc(r.common.candidate?.[1])];
      }));
      record();
    }
    for(const field of [fam,site,kind,outcome])field.addEventListener('change',refresh);
    query.addEventListener('input',refresh);refresh();
  }
  function mrp(){
    const box=panel(content);add(box,'h2','Versions du MRP industriel et simulé');
    add(box,'p','Le rapprochement utilise les mêmes versions et dates cibles. Les besoins et soldes ci-dessous sont planifiés.','muted');
    const filters=add(box,'div',undefined,'filters');
    const picker=select(filters,'Couple','mrp-pair',unique(data.mrp.map(pairId)).map(k=>[k,`${labelPair(k)} · ${family(k)}`]));
    const clock=select(filters,'Calendrier','mrp-clock',[['dimanche_samedi','Dimanche à samedi'],['lundi_dimanche','Lundi à dimanche']]);
    const scope=select(filters,'Cibles','mrp-scope',[['all','Toutes'],['first_4_weeks','Premières quatre semaines'],['extension_targets','Cibles prolongées'],['extension_vintages','Versions prolongées']]);
    picker.value='1920/268091';
    const part=add(box,'div');part.id='mrp-detail';
    const measures={prior_needs_I:'Besoins au plan',projected_balance_K:'Solde projeté'};
    function update(){
      part.replaceChildren();
      const rows=data.mrp.filter(r=>pairId(r)===picker.value&&r[2]===clock.value&&r[3]===scope.value);
      for(const period of [152,365]){
        const same=rows.filter(r=>r[1]===period);
        if(!same.length)continue;
        add(part,'h3',period===152?'Comparaison sur 152 jours':'Référence historique · 365 jours');
        table(part,['Scénario','Mesure','Unité','Points','WAPE','Biais','Erreur moyenne'],
          same.map(r=>[plans[r[0]],measures[r[6]],r[7],r[8],pc(r[9]),pc(r[10]),r[11]]),[3,6]);
      }
      if(!rows.length)add(part,'p','Aucun rapprochement sur ce périmètre.');
      add(part,'p','Source industrielle · Flow_Data_MRP_results.xlsx, besoins en colonne I et solde projeté en colonne K.','source');
    }
    [picker,clock,scope].forEach(e=>e.addEventListener('change',update));update();
  }
  function demand(){
    const box=panel(content), filters=add(box,'div',undefined,'filters');
    const pf=select(filters,'Produit fini','demand-pf',[['268091','268091'],['268967','268967']]);
    const part=add(box,'div');part.id='demand-detail';
    function update(){
      part.replaceChildren();
      const id=pf.value, f=data.forecast[id], h=data.history[id], a=data.autonomous.products[id], c=data.constants[id];
      add(part,'h2',`${id} · prévision, demande observée et scénarios autonomes`);
      table(part,['Comparaison','Semaines','Observé (UN)','Prévu ou injecté (UN)','WAPE','Biais'],
        [['Prévision commerciale · année',f.annual],['Prévision commerciale · jusqu’à mai',f.through_may],
         ['Historique transmis au simulateur · ancien fichier',h.archive],['Historique transmis au simulateur · version courante',h.current_prepared_input],
         ['Semaines publiées à la clôture dans le candidat',h.candidate_effective_weeks_published]].map(([name,v])=>
          [name,v.points,v.observed_sum,v.simulation_sum,pc(v.wape_pct),pc(v.bias_pct)]),[1,2,3]);
      add(part,'p','Le moteur prend connaissance de la demande hebdomadaire le lundi suivant. Un rapprochement à 0 % des données injectées vérifie la transmission de l’historique.','muted');
      const weeks=fold(part,'Relevés hebdomadaires et versions de la prévision');
      table(weeks,['Semaine','Version prévue','Prévision (UN)','Demande observée (UN)','Publication simulée','Quantité publiée','Sources'],
        data.demand[id].map(r=>[d(r.date),d(r.vintage),r.forecast,r.observed,day(r.publication?.[0]),r.publication?.[1],`${r.forecast_cell} · ${r.source_cell}`]),[2,3,5]);
      add(part,'h3','Demande autonome · évaluation sur 25 semaines tenues à l’écart');
      add(part,'p',`Apprentissage de janvier à juin. Évaluation du ${d(data.autonomous.holdout_first)} au ${d(data.autonomous.holdout_last)}. Les valeurs réelles de la deuxième période servent à la notation.`,'muted');
      const models=[['Prévision commerciale seule',a.known_forecast_alone],['Prévision redimensionnée',a.scaled_forecast],
        ['Médiane des scénarios autonomes',a.scenario_median_by_week],['Moyenne constante de la période d’apprentissage',c.mean_training],
        ['Médiane constante de la période d’apprentissage',c.median_training]];
      table(part,['Modèle','Total observé (UN)','Total prévu (UN)','WAPE','Biais'],models.map(([title,v])=>
        [title,v.observed_volume,v.predicted_volume,pc(v.wape_pct),pc(v.bias_pct)]),[1,2]);
      const auto=fold(part,'Scénario autonome et observations par semaine');
      table(auto,['Semaine','Observé (UN)','Prévision connue','Prévision redimensionnée','Médiane simulée','Sources'],a.weeks.map(r=>
        [d(r.period_start),r.held_out_actual,r.known_forecast,r.scaled_forecast,r.scenario_median,`${r.forecast_cell} · ${r.actual_cell}`]),[1,2,3,4]);
    }
    pf.addEventListener('change',update);update();
  }
  function local(){
    const box=panel(content);add(box,'h2','Essais appariés de portée locale');
    const filters=add(box,'div',undefined,'filters');
    const trial=select(filters,'Essai','local-trial',[['native_receipts','Dates d’achats initiaux'],
      ['native_pf_release','Contrôle unique des produits finis'],['dated_dispatch','Expéditions selon les besoins datés']]);
    const pair=select(filters,'Couple','local-pair',[]), body=add(box,'div');
    function selectCase(){
      const saved=pair.value;pair.replaceChildren();
      for(const key of Object.keys(data.local[trial.value].sunday)) add(pair,'option',labelPair(key)).value=key;
      if([...pair.options].some(o=>o.value===saved))pair.value=saved;
      show();
    }
    function show(){
      body.replaceChildren();
      const t=data.local[trial.value], s=t.sunday[pair.value];
      add(body,'p',`${t.days} jours simulés · clôture du dimanche et observations du lundi. Mesures par cas sur dates communes.`,'muted');
      table(body,['Période','Relevés','Erreur témoin','Erreur essai','Variation'],[['all','Toute la période'],['validation','Validation']]
        .filter(([key])=>s[key]).map(([key,label])=>[label,s[key].n,s[key].witness_mae,s[key].trial_mae,pc(s[key].change_mae_pct)]),[1,2,3]);
      table(body,['Date',`Observé (${s.points[0]?.unit||'UN'})`,'Témoin','Essai','Source'],
        s.points.map(p=>[d(p.photo),p.observed,p.witness,p.trial,p.cell]),[1,2,3]);
    }
    trial.addEventListener('change',selectCase);pair.addEventListener('change',show);selectCase();
  }
  const views={summary,series,mrp,demand,local};
  function open(name){for(const t of tabs)t.setAttribute('aria-pressed',String(t.dataset.view===name));content.replaceChildren();views[name]();}
  for(const t of tabs)t.addEventListener('click',()=>open(t.dataset.view));
  open('summary');
})();
</script>
</body></html>
