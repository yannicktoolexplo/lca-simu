lower_bound_positive":59,"current_excludes_full_receipt":3},"same_perimeter/second_half":{"tested":100,"positive_current_lower_bound":56,"positive_later_lower_bound":4,"neither_lower_bound_positive":40,"current_excludes_full_receipt":6},"stable_positive_residual_conditional/first_half":{"tested":19,"positive_current_lower_bound":3,"positive_later_lower_bound":2,"neither_lower_bound_positive":14,"current_excludes_full_receipt":6},"stable_positive_residual_conditional/second_half":{"tested":24,"positive_current_lower_bound":2,"positive_later_lower_bound":1,"neither_lower_bound_positive":21,"current_excludes_full_receipt":8}},"exclusions":{"physical_balance_open":34,"perimeter_unreconciled":24,"missing_snapshot_or_fields":1,"net_or_redundant_inbound":29},"distinct_eligible_pairs":22}</script>
<script>
(() => {
  'use strict';
  const id = name => document.getElementById(name);
  const data = JSON.parse(id('receipt-bounds-data').textContent);
  const pair = id('pair'), week = id('week'), detail = id('detail');
  const quick = [...document.querySelectorAll('button[data-week]')];
  const num = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:6});
  const pct = new Intl.NumberFormat('fr-FR',{style:'percent',maximumFractionDigits:2});
  const date = new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
  const sites = {'1430':'Gien','1450':'Gaillac','1810':'Avène','1920':'Muret'};
  const defaultPair = '1430/042342', defaultWeek = '2025-03-17';
  const groups = data.intervals.reduce((lookup,row)=>{
    (lookup[row.pair]??=[]).push(row);
    return lookup;
  },{});
  const q = value => Number.isFinite(value)?num.format(value):'Inconnu';
  const d = value => date.format(new Date(value+'T00:00:00Z'));
  function label(key) {
    const [site,article] = key.split('/');
    return `${article} · ${sites[site]||site} (${site})`;
  }
  function add(host,tag,text,cls) {
    const el=document.createElement(tag);
    if(text!==undefined) el.textContent=text;
    if(cls) el.className=cls;
    host.append(el);
    return el;
  }
  function option(select,value,text) { add(select,'option',text).value=value; }
  function table(host, headings, rows, numericColumns=[]) {
    const grid=add(add(host,'div',undefined,'table-wrap'),'table');
    const head=add(add(grid,'thead'),'tr'), body=add(grid,'tbody');
    headings.forEach((heading,i)=>{add(head,'th',heading,numericColumns.includes(i)?'numeric':'').scope='col';});
    for(const values of rows){
      const line=add(body,'tr');
      values.forEach((value,i)=>{
        const cell=add(line,i===0?'th':'td',value,numericColumns.includes(i)?'numeric':i===2?'source':'');
        if(i===0) cell.scope='row';
      });
    }
  }
  function range(host,name,[lo,hi],delivery,color,uom) {
    const row=add(host,'li'), text=add(row,'div',undefined,'range-text');
    const a=lo/delivery, b=hi/delivery;
    add(text,'span',name);
    add(text,'strong',`${q(lo)} à ${q(hi)} ${uom} (${pct.format(a)} à ${pct.format(b)})`);
    const bar=add(row,'div',undefined,'bar');
    bar.setAttribute('aria-hidden','true');
    bar.style.setProperty('--tone',color);
    const span=add(bar,'span',undefined,'bar-span');
    span.style.left=pctPosition(a);
    span.style.width=pctPosition(b-a);
    for(const position of new Set([a,b])) add(bar,'span',undefined,'bar-end').style.left=pctPosition(position);
    const legend=add(row,'div',undefined,'range-axis');
    add(legend,'span','0 %');
    add(legend,'span','100 % de la réception');
  }
  function pctPosition(value) { return `${100*value}%`; }
  function render(){
    const row=groups[pair.value].find(item=>item.week===week.value);
    detail.replaceChildren();
    add(detail,'h2',label(row.pair));
    add(detail,'p',`Réception enregistrée de ${q(row.receipt)} ${row.uom} · semaine du ${d(row.week)} · comparaison au relevé du ${d(row.earliest_checkpoint_known)}.`);
    const same=row.scope==='same_perimeter';
    add(detail,'p',same?'Périmètre concordant. Le stock physique et le total des rubriques du MRP concordent aux deux relevés.':
      `Résultat conditionnel. Le stock physique dépasse le total des rubriques du MRP de ${q(row.perimeter_residual)} ${row.uom} sur trois relevés consécutifs.`,'scope');
    const ranges=add(detail,'ul',undefined,'ranges');
    range(ranges,'Part classée en semaine courante du plan',row.current_bound,row.receipt,'var(--current)',row.uom);
    range(ranges,'Part classée dans les semaines futures du plan',row.later_bound,row.receipt,'var(--later)',row.uom);
    add(detail,'p','Ces intervalles décrivent le classement au plan. Ils n’identifient aucun lot ni aucune date de libération physique ou qualité.','muted');
    add(detail,'h3','Écritures et cellules utilisées');
    const f='Flow_Data_Inventory_and_Replenishment_rules.xlsx', m='Flow_Data_MRP_results.xlsx';
    table(detail,['Mesure',row.uom,'Source'],[
      ['Stock physique à l’ouverture',q(row.opening_physical),`${f}!${row.opening_cell}`],
      ['Réception enregistrée',q(row.receipt),`Flow_Data_Inventory_movements.xlsx!${row.movement_cell}`],
      ['Stock physique au relevé suivant',q(row.closing_physical),`${f}!${row.closing_cell}`],
      ['Quantité du plan · semaine courante (colonne J)',q(row.plan_current),`${m}!${row.current_cell}`],
      ['Quantité du plan · semaines futures (colonne J)',q(row.plan_later),row.later_cells.length?row.later_cells.map(cell=>`${m}!${cell}`).join(' · '):'Aucune ligne future positive'],
      ['Stock initial et autres apports possibles',q(row.possible_other_current),'Stock physique à l’ouverture et mouvements positifs du bilan']
    ],[1]);
    for(const button of quick) button.setAttribute('aria-pressed',String(row.pair===defaultPair&&row.week===button.dataset.week));
  }
  function setWeeks(preferred){
    week.replaceChildren();
    const rows=[...groups[pair.value]].sort((a,b)=>a.week.localeCompare(b.week));
    rows.forEach(row=>option(week,row.week,d(row.week)));
    if(rows.some(row=>row.week===preferred)) week.value=preferred;
    render();
  }
  function coverage(){
    const total=data.coverage.population.positive_receipts;
    const byScope=Object.entries(data.coverage).filter(([,entry])=>entry.tested);
    id('coverage').textContent=`${q(data.intervals.length)} semaines analysées sur ${q(total)} avec réception enregistrée · ${q(data.distinct_eligible_pairs)} couples article-site.`;
    const area=id('coverage-detail');
    table(area,['Périmètre et période','Analysées','Part courante minimale positive','Part future minimale positive','Deux minima nuls','100 % en courant impossible'],
      byScope.map(([key,c])=>{
        const [scope,period]=key.split('/');
        return [`${scope==='same_perimeter'?'Concordant':'Conditionnel'} · ${period==='first_half'?'janv.–juin':'juil.–déc.'}`,
          q(c.tested),q(c.positive_current_lower_bound),q(c.positive_later_lower_bound),q(c.neither_lower_bound_positive),q(c.current_excludes_full_receipt)];
      }),[1,2,3,4,5]);
    const reasons={physical_balance_open:'Bilan des mouvements incomplet',perimeter_unreconciled:'Périmètres du stock et du plan non rapprochés',
      missing_snapshot_or_fields:'Relevé ou champ absent',net_or_redundant_inbound:'Mouvement net ou entrées redondantes'};
    add(area,'h3',`${q(total-data.intervals.length)} semaines écartées`);
    table(area,['Motif','Semaines'],Object.entries(data.exclusions).map(([key,value])=>[reasons[key]||key,q(value)]),[1]);
    add(area,'p','La borne basse retranche du total de la rubrique tout ce que le stock d’ouverture et les autres apports pourraient expliquer. La borne haute est limitée à l’entrée enregistrée et au total de la rubrique.','muted');
  }
  for(const key of Object.keys(groups).sort()) option(pair,key,label(key));
  pair.value=defaultPair;
  pair.addEventListener('change',()=>setWeeks(week.value));
  week.addEventListener('change',render);
  for(const button of quick) button.addEventListener('click',()=>{pair.value=defaultPair;setWeeks(button.dataset.week);});
  setWeeks(defaultWeek);
  coverage();
})();
</script>
