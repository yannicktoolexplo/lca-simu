case_id: example_minimal
business_question: "Démontrer le pipeline générique etudecas sur un cas minimal."
data:
  path: data/reference/fal_aircraft_tiny.csv
  schema: configs/schemas/example_schema.yaml
trajectory:
  dimensions: [quality, delay, stress]
  time_column: date
  entity_column: aircraft_id
kpi_tree:
  performance:
    type: composite
    aggregation: weighted_mean
    children:
      quality: 0.4
      delay: 0.3
      stress: 0.3
  quality:
    type: elementary
    source_column: quality_score
    direction: maximize
    target: 1.0
    min: 0.0
    max: 1.0
  delay:
    type: elementary
    source_column: delay_days
    direction: minimize
    target: 0.0
    min: 0.0
    max: 20.0
  stress:
    type: elementary
    source_column: stress_index
    direction: minimize
    target: 0.0
    min: 0.0
    max: 1.0
visuals:
  trajectory_3d: configs/visuals/trajectory_3d.yaml
validation_rules: configs/validation/validation_rules.yaml
