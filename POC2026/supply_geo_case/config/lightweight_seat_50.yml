certification_gates:
  - gate_id: crash_static
    label: Charges statiques et dynamiques
    references: CS 25.561; CS 25.562; FAA AC 25.562-1B; SAE AS8049E
    status: non_demontre
    evidence_required: Modele de calcul correle, essais statiques, essais dynamiques et criteres de blessure occupant
  - gate_id: flammability
    label: Feu, fumee et toxicite cabine
    references: CS 25.853 et Appendix F; FAA AC 25.853-1
    status: non_demontre
    evidence_required: Coupons, panneaux et coussins representatifs de la configuration de production
  - gate_id: composite_structure
    label: Structure composite de siege
    references: SAE ARP6337; SAE AS8049E
    status: non_demontre
    evidence_required: Proprietes environnementales, dommages admissibles, fabrication, inspection, reparation et justification des chemins de charge
  - gate_id: occupant_installation
    label: Occupant, objets de masse et installation
    references: CS 25.785; CS 25.561; CS 25.562
    status: non_demontre
    evidence_required: Retenue occupant, ecran et rangements, evacuation, interfaces plancher et configuration cabine
  - gate_id: equipment_environment
    label: Equipements electriques et environnement
    references: DO-160 selon perimetre de qualification; exigences OEM applicables
    status: non_demontre
    evidence_required: CEM, temperature, vibration, alimentation, feu, maintenance et configuration logicielle

evidence_sources:
  - label: EASA CS-25 Amendment 28
