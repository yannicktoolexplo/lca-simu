[pytest]
# Reviewed scope, independent of external historical deliveries.
# After the Sophos incident, run only reviewed explicit node IDs.
# This discovery list is not permission to execute historical file-tampering tests.
testpaths =
    etudecas/tests
    etudecas/simulation
    etudecas/visualization
    etudecas/knowledge_graph
    etudecas/analysis
    etudecas/documentation
    etudecas/testing
    etudecas/prototypes/scan_2027_risk_control/tests/test_supplier_v8_stage3_dashboard.py
    etudecas/prototypes/scan_2027_risk_control/tests/test_supplier_operating_point_full_campaign_v8.py
    etudecas/prototypes/scan_2027_risk_control/tests/test_resume_supplier_operating_point_full_campaign_v8_bounded.py
    etudecas/prototypes/scan_2027_risk_control/tests/test_supplier_v2_controllable_action_selector.py
    etudecas/prototypes/scan_2027_risk_control/tests/test_historical_fixture_policy.py
    etudecas/prototypes/scan_2027_risk_control/tests/test_powershell_go_validation.py
    etudecas/prototypes/scan_2027_risk_control/tests/test_supplier_service_regime_calibration_runner.py
    etudecas/prototypes/scan_2027_risk_control/tests/test_supplier_dynamic_requirement_reference.py
    etudecas/prototypes/scan_2027_risk_control/tests/test_supplier_dynamic_capacity_coupling_audit.py
    etudecas/prototypes/scan_2027_risk_control/tests/test_supplier_v8_v2_to_stage3_v3_chain_task.py
    etudecas/prototypes/scan_2027_risk_control/tests/test_run_supplier_v8_v2_to_stage3_v4_chain_task.py
